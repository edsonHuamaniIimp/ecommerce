name: CI/CD — ContratosStands

# Pipeline (ECS = produccion real):
#   push a main  -> SOLO ci (lint/tsc/tests). NO construye imagen ni despliega.
#   manual (Actions > Run workflow) -> ci -> build-image (arm64) -> deploy-ecs (rollout).
# - El deploy a ECS es MANUAL a proposito: no queremos construir una imagen en cada push.
# - build-image corre en runner ARM NATIVO (ubuntu-24.04-arm, sin QEMU) => mucho mas rapido.
# - Si la imagen de ese commit YA existe en ECR, NO se reconstruye (idempotente).
# - build-image reusa capas (cache `type=gha`: reusa npm ci).
# - deploy-ecs hace `aws ecs update-service --force-new-deployment` (imagen :latest).
# - Terraform se usa solo para infraestructura, no para cada deploy de app.
# - EC2 queda como legado (deshabilitado salvo vars.DEPLOY_EC2=1).
# - Los cambios solo de docs (.md / docs/**) no disparan el pipeline.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Ejecutar deploy EC2 legado?'
        type: boolean
        default: false

concurrency:
  group: deploy-contratos-stands
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  AWS_DEFAULT_REGION: 'us-east-1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─── CI: Lint + TypeCheck + Tests ─────────────────────────────────────────
  ci:
    name: CI — Lint, TypeCheck y Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Generar Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npx eslint

      - name: TypeCheck
        run: npx tsc --noEmit

      - name: Tests
        run: npx vitest run src

  # ─── Imagen → ECR (arm64 + cache) ─────────────────────────────────────────
  build-image:
    name: Build imagen → ECR (arm64)
    runs-on: ubuntu-24.04-arm
    needs: ci
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar secrets ECR
        id: check-ecr
        run: |
          if [ -z "${{ secrets.ECR_REGISTRY }}" ] || [ -z "${{ secrets.ECR_REPOSITORY }}" ]; then
            echo "ECR no configurado. Saltando build de imagen."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Configurar credenciales AWS
        if: steps.check-ecr.outputs.skip != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

      - name: Verificar si la imagen del commit ya existe en ECR
        id: check-img
        if: steps.check-ecr.outputs.skip != 'true'
        run: |
          if aws ecr describe-images \
               --repository-name "${{ secrets.ECR_REPOSITORY }}" \
               --image-ids imageTag="${{ github.sha }}" >/dev/null 2>&1; then
            echo "La imagen ${{ github.sha }} ya existe en ECR. No se reconstruye."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Buildx
        if: steps.check-ecr.outputs.skip != 'true' && steps.check-img.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login ECR
        if: steps.check-ecr.outputs.skip != 'true' && steps.check-img.outputs.exists != 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y push (arm64 nativo, cache)
        if: steps.check-ecr.outputs.skip != 'true' && steps.check-img.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ecs
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=/api
            NEXT_PUBLIC_API_MOCK=0
            NEXT_PUBLIC_APP_ENV=production
            NEXT_PUBLIC_APP_URL=${{ secrets.APP_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Rollout ECS ──────────────────────────────────────────────────────────
  deploy-ecs:
    name: CD — Rollout ECS
    runs-on: ubuntu-latest
    needs: build-image
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      needs.build-image.result == 'success'
    steps:
      - name: Verificar secrets ECR
        id: check-ecr
        run: |
          if [ -z "${{ secrets.ECR_REGISTRY }}" ]; then
            echo "ECR no configurado. Saltando rollout."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Configurar credenciales AWS
        if: steps.check-ecr.outputs.skip != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

      - name: Forzar nuevo deployment en ECS
        if: steps.check-ecr.outputs.skip != 'true'
        run: |
          CLUSTER="${{ secrets.ECS_CLUSTER }}"; CLUSTER="${CLUSTER:-iimp-ctrst-prod-cluster}"
          SERVICE="${{ secrets.ECS_SERVICE }}"; SERVICE="${SERVICE:-iimp-ctrst-prod-service}"
          echo "Rollout en $CLUSTER / $SERVICE ..."
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --force-new-deployment >/dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
          echo "✅  Rollout ECS completado."

  # ─── EC2 (legado) ─────────────────────────────────────────────────────────
  deploy-ec2:
    name: CD — Deploy EC2 (legado)
    runs-on: ubuntu-latest
    needs: ci
    # LEGADO. Deshabilitado por defecto: activar con la variable de repo DEPLOY_EC2=1.
    if: |
      vars.DEPLOY_EC2 == '1' && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')
      )
    continue-on-error: true
    steps:
      - name: Verificar secrets de EC2
        id: check-secrets
        run: |
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "EC2_HOST no configurado. Saltando deploy."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy via SSH
        if: steps.check-secrets.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.2.2
        env:
          SEED_ON_DEPLOY: ${{ secrets.SEED_ON_DEPLOY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          envs: SEED_ON_DEPLOY
          script: |
            cd ${{ secrets.EC2_APP_PATH || '/var/www/contratos-stands' }}

            BEFORE=$(git rev-parse HEAD)

            git remote set-url origin https://github.com/edsonHuamaniIimp/ecommerce.git
            git -c credential.helper='!f() { echo "username=x-access-token"; echo "password=${{ secrets.EC2_GIT_TOKEN }}"; }; f' -c credential.helper='cache --timeout=0' pull origin main || echo "git pull fallo"

            CHANGED=$(git diff --name-only "$BEFORE" HEAD -- Dockerfile package.json package-lock.json 2>/dev/null)
            if [ -n "$CHANGED" ]; then
              echo "Cambios en dependencias base, rebuild..."
              docker compose --env-file .env.prod -f docker-compose.prod.yml build --no-cache
            fi

            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d

            docker exec ctrst-app npx prisma migrate deploy || true

            if [ "${SEED_ON_DEPLOY}" = "1" ]; then
              echo "Seed (idempotente)..."
              docker exec -e SEED_ALLOW_PROD=1 ctrst-app npm run db:seed || echo "seed fallo"
            fi

            echo "✅  Deploy EC2 completado."
