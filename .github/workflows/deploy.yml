name: CI/CD — ContratosStands

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Ejecutar deploy en servidor?'
        type: boolean
        default: false

concurrency:
  group: deploy-contratos-stands
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  AWS_DEFAULT_REGION: 'us-east-1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─── CI: Lint + TypeCheck ─────────────────────────────────────────────────
  ci:
    name: CI — Lint & TypeCheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Generar Prisma Client
        run: npx prisma generate

      - name: Lint (ESLint)
        continue-on-error: true
        run: npm run lint || true

      - name: TypeCheck (tsc)
        continue-on-error: true
        run: npx tsc --noEmit || true

  # ─── Imagen → ECR (deploy real: ECS/Aurora) ───────────────────────────────
  # Publica la imagen de revisión (:sha). El rollout a ECS se hace con Terraform
  # `image_tag=<sha>` (ver docs/02-despliegue/estrategia-despliegue.md).
  build-image:
    name: Build imagen → ECR (ECS)
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar secrets ECR
        id: check-ecr
        run: |
          if [ -z "${{ secrets.ECR_REGISTRY }}" ] || [ -z "${{ secrets.ECR_REPOSITORY }}" ]; then
            echo "ECR no configurado. Saltando build de imagen."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Configurar credenciales AWS
        if: steps.check-ecr.outputs.skip != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

      - name: Login ECR
        if: steps.check-ecr.outputs.skip != 'true'
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }} \
            | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

      - name: Build y push imagen
        if: steps.check-ecr.outputs.skip != 'true'
        run: |
          IMAGE="${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}"
          docker build -f Dockerfile.ecs -t "$IMAGE" \
            --build-arg NEXT_PUBLIC_API_URL=/api \
            --build-arg NEXT_PUBLIC_API_MOCK=0 \
            --build-arg NEXT_PUBLIC_APP_ENV=production \
            --build-arg NEXT_PUBLIC_APP_URL="${{ secrets.APP_URL }}" \
            .
          docker push "$IMAGE"
          echo "✅  Imagen publicada: $IMAGE"

  # ─── Build: Build Next.js ─────────────────────────────────────────────────
  build:
    name: Build — Next.js
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Generar Prisma Client
        run: npx prisma generate

      - name: Build Next.js
        run: npm run build

      - name: Subir build a artefacto
        uses: actions/upload-artifact@v4
        with:
          name: build-assets
          path: |
            .next/standalone/
            .next/static/
            public/
          retention-days: 7

  # ─── CD: Deploy a EC2 ────────────────────────────────────────────────────
  deploy:
    name: CD — Deploy EC2 (legado)
    runs-on: ubuntu-latest
    needs: ci
    # LEGADO (EC2). El dominio de produccion lo sirve ECS (CloudFront->ALB->ECS+Aurora),
    # desplegado con la imagen de ECR (job build-image) via Terraform `image_tag`.
    # Deshabilitado por defecto: activar con la variable de repo DEPLOY_EC2=1.
    if: |
      vars.DEPLOY_EC2 == '1' && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')
      )
    continue-on-error: true

    steps:
      - name: Verificar secrets de EC2
        id: check-secrets
        run: |
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "EC2_HOST no configurado. Saltando deploy."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy via SSH
        if: steps.check-secrets.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.2.2
        env:
          SEED_ON_DEPLOY: ${{ secrets.SEED_ON_DEPLOY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          envs: SEED_ON_DEPLOY
          script: |
            cd ${{ secrets.EC2_APP_PATH || '/var/www/contratos-stands' }}

            BEFORE=$(git rev-parse HEAD)

            git remote set-url origin https://github.com/edsonHuamaniIimp/ecommerce.git
            git -c credential.helper='!f() { echo "username=x-access-token"; echo "password=${{ secrets.EC2_GIT_TOKEN }}"; }; f' -c credential.helper='cache --timeout=0' pull origin main || echo "git pull fallo"

            CHANGED=$(git diff --name-only "$BEFORE" HEAD -- Dockerfile package.json package-lock.json 2>/dev/null)
            if [ -n "$CHANGED" ]; then
              echo "Cambios en dependencias base, rebuild..."
              docker compose --env-file .env.prod -f docker-compose.prod.yml build --no-cache
            fi

            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d

            # Ejecutar migraciones Prisma
            docker exec ctrst-app npx prisma migrate deploy || true

            # Seed idempotente (opcional): activar con el secret SEED_ON_DEPLOY=1
            if [ "${SEED_ON_DEPLOY}" = "1" ]; then
              echo "🌱  Ejecutando seed (idempotente)..."
              docker exec -e SEED_ALLOW_PROD=1 ctrst-app npm run db:seed || echo "⚠️  seed fallo"
            fi

            echo "✅  Deploy completado."

  # ─── Sync S3: Subir assets a bucket ─────────────────────────────────────
  sync-s3:
    name: CD — Sync assets a S3
    runs-on: ubuntu-latest
    needs: build
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')
    continue-on-error: true

    steps:
      - name: Verificar secrets de S3
        id: check-s3
        run: |
          if [ -z "${{ secrets.AWS_BUCKET }}" ]; then
            echo "AWS_BUCKET no configurado. Saltando sync S3."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Descargar artefacto build
        if: steps.check-s3.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: build-assets

      - name: Configurar credenciales AWS
        if: steps.check-s3.outputs.skip != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

      - name: Sync static assets a S3
        if: steps.check-s3.outputs.skip != 'true'
        run: |
          aws s3 sync .next/static/ s3://${{ secrets.AWS_BUCKET }}/_next/static/ \
            --delete \
            --cache-control "max-age=31536000,immutable"
