name: CI/CD QA - ContratosStands

# Pipeline de QA:
#   push a la rama qa -> CI + build amd64 + push a ECR QA + deploy por SSM a la EC2 QA.
#   manual (Actions > Run workflow) -> mismo flujo.
# - La instancia QA es x86_64 (t3.small); la imagen se construye para linux/amd64.
# - La app se reinicia con el env-file /opt/ctrst-qa/app.env de la instancia.
# - Las migraciones Prisma pendientes se aplican al iniciar el contenedor; no se recrea la base.
# - Producción (main) tiene su propio workflow deploy.yml.

on:
  push:
    branches: [qa]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: deploy-contratos-stands-qa
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  AWS_DEFAULT_REGION: 'us-east-1'

jobs:
  ci:
    name: CI QA - Lint, TypeCheck y Tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ctrst
          POSTGRES_PASSWORD: ctrst
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ctrst"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Generar Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npx eslint

      - name: TypeCheck
        run: npx tsc --noEmit

      - name: Tests
        run: npx vitest run src

      - name: Drift schema vs migraciones
        env:
          SHADOW_DATABASE_URL: postgresql://ctrst:ctrst@localhost:5432/shadow
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --exit-code

  build-image:
    name: Build imagen QA -> ECR
    runs-on: ubuntu-24.04
    environment: qa
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

      - name: Login ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build y push amd64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ecs
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=/api
            NEXT_PUBLIC_API_MOCK=0
            NEXT_PUBLIC_APP_ENV=qa
            NEXT_PUBLIC_APP_URL=${{ secrets.APP_URL }}
            NEXT_PUBLIC_PUSHER_KEY=${{ secrets.NEXT_PUBLIC_PUSHER_KEY }}
            NEXT_PUBLIC_PUSHER_CLUSTER=${{ secrets.NEXT_PUBLIC_PUSHER_CLUSTER }}
          cache-from: type=gha,scope=qa
          cache-to: type=gha,mode=max,scope=qa

  deploy-qa:
    name: CD QA - Deploy EC2 por SSM
    runs-on: ubuntu-24.04
    needs: [ci, build-image]
    # El deploy espera a CI y build; si cualquiera falla, no se despliega.
    if: needs.ci.result == 'success' && needs.build-image.result == 'success'
    environment: qa
    steps:
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

      - name: Desplegar y verificar salud
        env:
          INSTANCE_ID: ${{ secrets.QA_INSTANCE_ID }}
          REGISTRY: ${{ secrets.ECR_REGISTRY }}
          REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          : "${INSTANCE_ID:?QA_INSTANCE_ID no configurado}"
          : "${REGISTRY:?ECR_REGISTRY no configurado}"
          : "${REPOSITORY:?ECR_REPOSITORY no configurado}"
          IMAGE="${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}"
          REPO="${REGISTRY}/${REPOSITORY}"

          COMMANDS_JSON=$(jq -nc --arg image "$IMAGE" --arg repo "$REPO" '[
            "set -euo pipefail",
            "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin " + $repo,
            "docker rm -f ctrst-qa-app >/dev/null 2>&1 || true",
            "docker image prune -af >/dev/null 2>&1 || true",
            "docker builder prune -af >/dev/null 2>&1 || true",
            "docker pull " + $image,
            "docker network inspect ctrst-qa-net >/dev/null 2>&1 || docker network create ctrst-qa-net",
            "docker run -d --name ctrst-qa-app --restart unless-stopped --network ctrst-qa-net --env-file /opt/ctrst-qa/app.env -p 3000:3000 -v /opt/ctrst-qa/uploads:/app/public/uploads " + $image,
            "docker exec ctrst-qa-app npx prisma migrate deploy",
            "for i in $(seq 1 36); do if docker exec ctrst-qa-app curl -fsS http://localhost:3000/api/health >/dev/null 2>&1; then echo \"QA app healthy\"; exit 0; fi; sleep 5; done",
            "docker logs --tail 100 ctrst-qa-app >&2 || true",
            "exit 1"
          ]')

          jq -n \
            --arg iid "$INSTANCE_ID" \
            --argjson commands "$COMMANDS_JSON" \
            --arg comment "QA deploy ${IMAGE_TAG}" \
            '{InstanceIds: [$iid], DocumentName: "AWS-RunShellScript", Comment: $comment, TimeoutSeconds: 1800, Parameters: {commands: $commands}}' \
            > /tmp/ssm-qa.json

          COMMAND_ID=$(aws ssm send-command \
            --cli-input-json file:///tmp/ssm-qa.json \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command: $COMMAND_ID"

          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)
            case "$STATUS" in
              Success)
                echo "Deploy QA completado: $IMAGE"
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                echo "Deploy QA falló: $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{out: StandardOutputContent, err: StandardErrorContent}' \
                  --output json || true
                exit 1
                ;;
            esac
            echo "[$i/90] SSM status=$STATUS"
            sleep 5
          done

          echo "Timeout esperando el deploy QA"
          exit 1
