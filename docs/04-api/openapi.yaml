                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      id: { type: string }
  /debida-diligencia/matriz-evaluacion/detalle:
    get:
      tags: [DebidaDiligencia]
      summary: Detalle completo de un vinculo de la Matriz de evaluacion DD
      parameters:
        - { name: id, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DdMatrizEvaluacionDetalleResponse"
  /debida-diligencia/matriz-evaluacion/guardar:
    post:
      tags: [DebidaDiligencia]
      summary: Guarda secciones de un vinculo (cada una exige el permiso de su area)
      description: >
        Solo se procesan las secciones presentes. SIG (`dd:revision`): identidad (solo ambito en filas
        automaticas), generales, listas, sig y conclusion reputacional. Reputacional (`dd:reputacion`):
        reputacional completo. Compliance (`dd:legal`): compliance, solo si SIG concluyo REQUIERE DEBIDA
        DILIGENCIA REFORZADA y adjunto informe. Resultado final: SIG o Compliance. Los valores de catalogo
        aceptan la etiqueta de negocio ("EN REVISIÓN") o el codigo ("en_revision").
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DdMatrizEvaluacionGuardarRequest"
      responses:
        "200":
          description: Detalle actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DdMatrizEvaluacionDetalleResponse"
        "400":
          description: Regla del proceso incumplida (p. ej. OBSERVADO sin observacion)
        "403":
          description: Sin permiso para la seccion o Compliance bloqueado
  /debida-diligencia/matriz-evaluacion/vinculo:
    post:
      tags: [DebidaDiligencia]
      summary: Agrega a mano una persona o empresa vinculada a un expediente
      requestBody:
