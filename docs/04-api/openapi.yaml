                tipo: { type: string, enum: [representante, beneficiario, vinculado] }
                nombre: { type: string }
                tipoDocumento: { type: string, nullable: true }
                documento: { type: string, nullable: true }
                nacionalidad: { type: string, nullable: true }
                cargo: { type: string, nullable: true }
                ambito: { type: string, enum: [nacional, extranjero] }
                pais: { type: string, nullable: true, description: ISO, nombre o gentilicio; si falta se deriva de la nacionalidad }
      responses:
        "200":
          description: Detalle del vinculo creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DdMatrizEvaluacionDetalleResponse"
  /debida-diligencia/matriz-evaluacion/vinculo/eliminar:
