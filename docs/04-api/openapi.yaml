openapi: 3.0.3
info:
  title: ContratosStands API (IIMP)
  version: 0.1.0-draft
  description: >
    API del sistema **ContratosStands** — handler/procesador de reservas de stands
    para eventos IIMP (Perumin, ProExplo, WMC, GESS). BORRADOR derivado del onboarding
    técnico; los contratos con el sistema de facturación (John/SAP) están **por
    confirmar**. Este documento es la fuente de verdad (Swagger/OpenAPI) de la API.
  contact:
    name: Equipo ContratosStands
servers:
  - url: http://localhost:3000/api
    description: Desarrollo local
  - url: https://dev.contratos-stands.iimp/api
    description: Ambiente Dev (PC)
  - url: https://qa.contratos-stands.iimp/api
    description: Ambiente QA (PC)
tags:
  - name: Eventos
    description: Eventos padre y versiones (multievento)
  - name: Plano
    description: Plano interactivo y stands
  - name: Gess
    description: Stands del evento (catálogo local) e integración con el API de stands del IIMP (liststand)
  - name: Reservas
    description: Registro y consulta de reservas
  - name: Aprobaciones
    description: Flujo Legal -> Logística -> Eventos/Asociados
  - name: Facturacion
    description: Interoperabilidad con facturación (SAP/John)
  - name: Empresas
    description: Consumo (proxy) de empresas/personas
  - name: Usuarios
    description: Accesos del Portal del Cliente (backoffice) contra servicio-persona
  - name: DebidaDiligencia
    description: Formulario, revision de Logistica, revision reputacional de Comunicaciones y panel del modulo
  - name: SGC
    description: Integración con el Sistema de Gestión de Contratos (expediente, documentos, descarga, webhooks)
security:
  - bearerAuth: []
paths:
  /eventos-padre:
    get:
      tags: [Eventos]
      summary: Lista los eventos padre (verticales)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventoPadre"
  /eventos:
    get:
      tags: [Eventos]
      summary: Lista eventos (versiones) por evento padre
      parameters:
        - name: eventoPadreId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Evento"
  /eventos/{eventoId}/plano:
    get:
      tags: [Plano]
      summary: Devuelve los stands con posición X/Y y estado para el plano interactivo
      parameters:
        - $ref: "#/components/parameters/EventoId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanoStand"
        "404":
          $ref: "#/components/responses/NotFound"
  /eventos/{eventoId}/tipos-stand:
    get:
      tags: [Plano]
      summary: Lista los tipos de stand del evento (con monto y contrato)
      parameters:
        - $ref: "#/components/parameters/EventoId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TipoStand"
  /gess:
    get:
      tags: [Gess]
      summary: Lista stands GESS vinculados o busca por bloqueId
      parameters:
        - name: eventoId
          in: query
          schema:
            type: string
        - name: bloqueId
          in: query
          description: ID del bloque del plano isométrico (EXT-IZQ-01, ...)
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/GessStand"
                  - $ref: "#/components/schemas/GessStand"
                  - type: "null"
    patch:
      tags: [Gess]
      summary: Vincula o desvincula un stand GESS a un bloque del plano isométrico
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string }
                bloqueId:
                  type: string
                  nullable: true
                  description: ID del bloque 3D o null para desvincular
      responses:
        "200":
          description: Vínculo actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GessStand"
  /gess/sync:
    post:
      tags: [Gess]
      summary: Sincroniza stands del API de stands del IIMP (liststand) hacia la BD local (upsert por eventoId+standApiId)
      description: |
        Actualiza `tipoStand`, `medidas`, `pabellon` y `rawData`. En re-importación conserva el
        estado local (`en_evaluacion`/`reservado`) si el API reporta `LIBRE`, no pisa la empresa
        con vacío y no toca `bloqueId`, documentos ni imágenes. Ver
        `docs/05-integraciones/integracion-liststand.md`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventoId]
              properties:
                eventoId: { type: string }
                tipoEvento:
                  type: integer
                  description: TipEvCod del evento versión (API del IIMP)
                codigoEvento:
                  type: integer
                  description: EvenCod del evento versión (API del IIMP)
                seleccionadas:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
      responses:
        "200":
          description: Resultado de la sincronización
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GessSyncResult"
  /gess/pre-reservar:
    post:
      tags: [Gess]
      summary: Pre-reserva stands disponibles en lote (empresa o título; bloqueo sin solicitud ni contrato)
      description: |
        Todo o nada: si algún stand no está `disponible` responde 409 y no modifica ninguno.
        El estado pasa a `pre_reservado` (se comporta como reservado en el plano) y se guarda
        el snapshot de la empresa (razón social, RUC, SIE) **o** el título libre, además de nota
        y autor. Al menos uno de `razonSocial`/`titulo` es obligatorio; lo registrado se muestra
        en el hover del plano.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [standIds]
              properties:
                standIds:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { type: string }
                razonSocial: { type: string, nullable: true, maxLength: 200 }
                titulo: { type: string, nullable: true, maxLength: 200, description: Alternativa libre a la empresa; se muestra en el hover }
                ruc: { type: string, nullable: true, maxLength: 20 }
                sie: { type: string, nullable: true, maxLength: 20, description: Código SIE de entidades (ej. E0000003804) }
                nota: { type: string, nullable: true, maxLength: 300 }
      responses:
        "200":
          description: Pre-reservas aplicadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  preReservados: { type: integer }
        "400":
          description: Datos inválidos (sin stands o sin razón social/título)
        "403":
          description: Sin permisos para gestionar pre-reservas
        "409":
          description: Algún stand no está disponible (no se modificó ninguno)
  /gess/liberar:
    post:
      tags: [Gess]
      summary: Libera pre-reservas en lote (vuelven a `disponible` y se limpia la empresa asignada)
      description: "Todo o nada: si algún stand no está `pre_reservado` responde 409 y no modifica ninguno."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [standIds]
              properties:
                standIds:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { type: string }
      responses:
        "200":
          description: Pre-reservas liberadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  liberados: { type: integer }
        "403":
          description: Sin permisos para gestionar pre-reservas
        "409":
          description: Algún stand no está pre-reservado (no se modificó ninguno)
  /gess/pre-reserva:
    patch:
      tags: [Gess]
      summary: Edita empresa/título/logo/nota de una pre-reserva vigente (stand `pre_reservado`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [standId]
              properties:
                standId: { type: string }
                razonSocial: { type: string, nullable: true, maxLength: 200 }
                titulo: { type: string, nullable: true, maxLength: 200, description: Alternativa libre a la empresa; null lo limpia }
                ruc: { type: string, nullable: true, maxLength: 20 }
                sie: { type: string, nullable: true, maxLength: 20 }
                logoUrl: { type: string, nullable: true, maxLength: 500, description: "null limpia el logo" }
                nota: { type: string, nullable: true, maxLength: 300, description: "null limpia la nota" }
      responses:
        "200":
          description: Pre-reserva actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  actualizado: { type: boolean }
        "403":
          description: Sin permisos para gestionar pre-reservas
        "404":
          description: Stand no encontrado
        "409":
          description: El stand no está pre-reservado
  /planogess/fetch:
    post:
      tags: [Gess]
      summary: Lista los stands del evento desde el API del IIMP (liststand) para el preview de Vinculación
      description: |
        Login con cuenta técnica (acceso VTA) + `POST /stands/liststand`. Devuelve filas aplanadas
        (`stand`, `pabellon`, `tipo`, `area`, `precio`, `estado`, `moneda`, `orden`). Solo lectura.
        Ver `docs/05-integraciones/integracion-liststand.md`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipoEvento, codigoEvento]
              properties:
                tipoEvento:
                  type: integer
                  description: TipEvCod del evento versión
                codigoEvento:
                  type: integer
                  description: EvenCod del evento versión
      responses:
        "200":
          description: Filas de stands del evento
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
  /reservas:
    post:
      tags: [Reservas]
      summary: Registra una reserva de uno o varios stands
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservaCreate"
      responses:
        "201":
          description: Reserva registrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reserva"
        "409":
          description: Uno o más stands ya no están disponibles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          $ref: "#/components/responses/ValidationError"
    get:
      tags: [Reservas]
      summary: Lista reservas (dashboard)
      parameters:
        - name: eventoId
          in: query
          schema:
            type: string
        - name: estado
          in: query
          schema:
            $ref: "#/components/schemas/EstadoReserva"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reserva"
  /reservas/{reservaId}:
    get:
      tags: [Reservas]
      summary: Detalle de una reserva
      parameters:
        - $ref: "#/components/parameters/ReservaId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reserva"
        "404":
          $ref: "#/components/responses/NotFound"
  /reservas/{reservaId}/contrato:
    get:
      tags: [Reservas]
      summary: Descarga el formato de contrato (PDF) según el tipo de stand
      parameters:
        - $ref: "#/components/parameters/ReservaId"
      responses:
        "200":
          description: PDF del contrato
          content:
            application/pdf:
              schema:
                type: string
                format: binary
  /reservas/{reservaId}/aprobaciones:
    post:
      tags: [Aprobaciones]
      summary: Registra la resolución de un área (Legal/Logística/Eventos)
      parameters:
        - $ref: "#/components/parameters/ReservaId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AprobacionInput"
      responses:
        "200":
          description: Aprobación registrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reserva"
  /reservas/{reservaId}/facturacion:
    post:
      tags: [Facturacion]
      summary: Envía la reserva al módulo de facturación (SAP/John)
      description: Interoperabilidad. Contrato de datos **por confirmar** con John.
      parameters:
        - $ref: "#/components/parameters/ReservaId"
      responses:
        "202":
          description: Enviado a facturación (procesamiento asíncrono)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InteropFacturacion"
  /interop/facturacion/callback:
    post:
      tags: [Facturacion]
      summary: Callback de facturación (SAP/John) con el resultado
      description: Recibe orden de venta/comprobante y estado ocupado/no ocupado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InteropCallback"
      responses:
        "200":
          description: Procesado
  /empresas:
    get:
      tags: [Empresas]
      summary: Busca empresas (proxy hacia la fuente única / John / Niel)
      parameters:
        - name: q
          in: query
          description: Razón social o RUC
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Empresa"
  /empresas/listar:
    get:
      tags: [Empresas]
      summary: Bandeja paginada de empresas registradas por el backoffice
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
        - name: search
          in: query
          description: Razón social o RUC
          schema: { type: string }
        - name: estado
          in: query
          schema: { type: string, enum: [activa, inactiva] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, total, page, perPage, totalPages]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/EmpresaRegistrada"
                  total: { type: integer }
                  page: { type: integer }
                  perPage: { type: integer }
                  totalPages: { type: integer }
        "403":
          description: Sin permiso empresas:view
  /empresas/detalle:
    get:
      tags: [Empresas]
      summary: Detalle de una empresa registrada
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmpresaRegistrada"
        "404":
          $ref: "#/components/responses/NotFound"
  /empresas/crear:
    post:
      tags: [Empresas]
      summary: Alta individual de empresa (valida RUC, correos y duplicados)
      description: |
        Ademas de la ficha contractual local, asegura la empresa en **servicio-persona**
        (fuente) de forma best-effort: la busca por RUC y la crea si no existe, guardando
        su `sie_code` en la ficha. Sin direccion/correo/telefono (minimos de la fuente) o
        si servicio-persona falla, la ficha se crea igual con el `sie_code` pendiente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmpresaRegistradaInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmpresaRegistrada"
        "400":
          description: Datos inválidos (RUC, razón social, correos o comprobante)
        "409":
          description: RUC ya registrado
  /empresas/actualizar:
    post:
      tags: [Empresas]
      summary: Edición parcial de una empresa (solo campos enviados)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/EmpresaRegistradaInput"
                - type: object
                  required: [id]
                  properties:
                    id: { type: string, format: uuid }
      responses:
        "200":
          description: OK
  /empresas/estado:
    post:
      tags: [Empresas]
      summary: Activa o desactiva una empresa (baja lógica)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, estado]
              properties:
                id: { type: string, format: uuid }
                estado: { type: string, enum: [activa, inactiva] }
      responses:
        "200":
          description: OK
  /empresas/carga-masiva/previsualizar:
    post:
      tags: [Empresas]
      summary: Valida un archivo Excel/CSV de empresas (validación previa por fila)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo: { type: string, format: binary }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrevisualizacionCargaEmpresas"
        "400":
          description: Formato/tamaño inválido o archivo sin filas
  /empresas/carga-masiva/importar:
    post:
      tags: [Empresas]
      summary: Importa las filas válidas de la carga masiva (omite las que tienen error)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filas]
              properties:
                filas:
                  type: array
                  items:
                    $ref: "#/components/schemas/FilaCargaEmpresa"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [creadas, omitidas]
                properties:
                  creadas: { type: integer }
                  omitidas: { type: integer }
  /empresas/crear-cuenta:
    post:
      tags: [Empresas]
      summary: Crea la cuenta de acceso de la empresa (solo con RUC)
      description: |
        Crea la cuenta del representante legal usando el RUC como usuario (correo
        provisional `acceso-<ruc>@acceso.iimp`), con contrasena temporal. NO envia
        correo: devuelve la contrasena para mostrarla una vez al administrador. Al
        primer ingreso el representante la cambia y completa sus datos en el perfil.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultadoCredencialesEmpresa"
        "409":
          description: La empresa ya tiene cuenta o el RUC ya tiene cuenta
  /empresas/crear-cuentas:
    post:
      tags: [Empresas]
      summary: Crea cuentas de acceso (solo con RUC) en lote
      description: |
        Crea la cuenta de cada empresa por RUC (max. 500). Sin envio de correo:
        devuelve por fila el usuario y la contrasena temporal para entregarlos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rucs]
              properties:
                rucs:
                  type: array
                  maxItems: 500
                  items: { type: string, pattern: "^[0-9]{11}$" }
      responses:
        "200":
          description: Resultado por RUC
          content:
            application/json:
              schema:
                type: object
                properties:
                  creadas: { type: integer }
                  omitidas: { type: integer }
                  resultados:
                    type: array
                    items:
                      type: object
                      properties:
                        ruc: { type: string }
                        razonSocial: { type: string }
                        usuario: { type: string, nullable: true }
                        passwordTemporal: { type: string, nullable: true }
                        creada: { type: boolean }
                        error: { type: string, nullable: true }
  /empresas/reenviar-credenciales:
    post:
      tags: [Empresas]
      summary: Regenera la contraseña temporal y reenvía las credenciales
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultadoCredencialesEmpresa"
        "404":
          $ref: "#/components/responses/NotFound"
  /empresas/revertir-cuenta:
    post:
      tags: [Empresas]
      summary: Revierte una cuenta con correo a cuenta solo-RUC (usuario = RUC)
      description: |
        Convierte la cuenta de una empresa SIN representante legal (creada con
        correo real) a cuenta solo-RUC: cambia el correo de acceso a
        `acceso-<ruc>@acceso.iimp`, reescribe el userId de la cuenta y regenera la
        contrasena temporal sin enviar correo (se muestra una vez al administrador).
        Con representante legal la cuenta con correo es la legitima y no se revierte.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultadoCredencialesEmpresa"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: La empresa tiene representante legal, no tiene cuenta, o la cuenta ya usa el RUC
  /empresas/sincronizar-representante:
    post:
      tags: [Empresas]
      summary: Sincroniza al representante legal con servicio-persona (crear/actualizar)
      description: |
        Reutiliza por DNI a la persona en servicio-persona (la actualiza si difiere) o
        la crea si no existe (requiere respuesta de RENIEC para nombres/apellidos), y
        guarda su `representanteSieCode` en la ficha local. Solo admin (`empresas:manage`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmpresaRegistrada"
        "400":
          description: La empresa no tiene DNI valido del representante
        "502":
          description: RENIEC sin datos o servicio de personas no disponible
  /empresas/fuente:
    get:
      tags: [Empresas]
      summary: Busca empresas en servicio-persona (fuente) por razon social o RUC
      description: |
        La empresa vive en servicio-persona (fuente del ecosistema IIMP). Acepta el
        mismo criterio que el listado de la fuente: prefijo de razon social o RUC
        (11 digitos). Requiere `empresas:manage`.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 3, maxLength: 120 }
          description: Razon social o RUC
      responses:
        "200":
          description: Empresas encontradas en la fuente (vacio si no hay coincidencias)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    sieCode: { type: string, description: sie_code de la empresa en servicio-persona }
                    nombre: { type: string }
                    idTipoDocumento: { type: string, description: "6 = RUC, 0 = no domiciliado" }
                    documento: { type: string }
                    direccion: { type: string, nullable: true }
                    correo: { type: string, nullable: true }
                    telefono: { type: string, nullable: true }
        "400":
          description: q requerido (minimo 3 caracteres)
        "502":
          description: Error de servicio-persona
  /empresas/persona-fuente:
    get:
      tags: [Empresas]
      summary: Busca una persona en servicio-persona y el padron interno (representante legal)
      description: |
        Devuelve la persona de la fuente por tipo y numero de documento; se usa al
        registrar al representante legal de una empresa. Requiere `empresas:manage`.
      parameters:
        - name: tipoDocumento
          in: query
          required: false
          schema: { type: string, enum: ["1", "4", "7"], default: "1", description: "1 = DNI, 4 = CE, 7 = Pasaporte" }
        - name: numeroDocumento
          in: query
          required: true
          schema: { type: string, maxLength: 15 }
      responses:
        "200":
          description: Persona encontrada (null si no existe en la fuente)
          content:
            application/json:
              schema:
                type: object
                nullable: true
                properties:
                  sieCode: { type: string }
                  documento: { type: string }
                  nombreCompleto: { type: string }
                  direccion: { type: string, nullable: true }
                  correo: { type: string, nullable: true }
                  celular: { type: string, nullable: true }
        "400":
          description: Parametros invalidos
        "502":
          description: Error de servicio-persona
  /empresas/registrar-cuenta-empresa:
    post:
      tags: [Empresas]
      summary: Registra la relacion usuario (persona) - empresa con servicio-persona como fuente
      description: |
        Asegura la empresa y la persona de contacto en servicio-persona (las crea si no
        existen, usando su documento) y crea la cuenta local con sus identificadores
        (`sie_code` de la persona e `id_empresa` de la empresa). Si la empresa es RUC,
        mantiene/crea la ficha contractual local minima ligada por RUC. Envia las
        credenciales por correo. Requiere `empresas:manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [empresa, persona, email]
              properties:
                sieCodeEmpresa:
                  type: string
                  nullable: true
                  description: sie_code de la empresa ya elegida en la busqueda (null = crearla en la fuente)
                empresa:
                  type: object
                  required: [nombre, idTipoDocumento, documento, direccion, correo, telefono, pais]
                  properties:
                    nombre: { type: string, maxLength: 100 }
                    idTipoDocumento: { type: string, enum: ["6", "0"] }
                    documento: { type: string, maxLength: 20 }
                    direccion: { type: string, maxLength: 200 }
                    correo: { type: string, maxLength: 101 }
                    telefono: { type: string, maxLength: 35 }
                    pais: { type: integer, description: Codigo de ubigeo (75 = PERU) }
                    linkLogo: { type: string, nullable: true, maxLength: 2048 }
                persona:
                  type: object
                  required: [tipoDocumento, documento, apellidoPaterno, nombres]
                  properties:
                    tipoDocumento: { type: string, enum: ["1", "4", "7"], description: "1 = DNI, 4 = CE, 7 = Pasaporte" }
                    documento: { type: string, maxLength: 15 }
                    apellidoPaterno: { type: string, maxLength: 30 }
                    apellidoMaterno: { type: string, nullable: true, maxLength: 30 }
                    nombres: { type: string, maxLength: 30 }
                    celular: { type: string, nullable: true, maxLength: 35 }
                    direccion: { type: string, nullable: true, maxLength: 100, description: Direccion de la persona (la fuente la exige al crear/actualizar) }
                email: { type: string, description: Correo del acceso local (login) }
                rolId: { type: string, nullable: true, description: "Rol local; por defecto cliente" }
      responses:
        "201":
          description: Relacion registrada y cuenta local creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  email: { type: string }
                  emailEnviado: { type: boolean }
                  sieCodeEmpresa: { type: string }
                  sieCodePersona: { type: string }
                  empresaCreadaEnFuente: { type: boolean }
                  empresaActualizadaEnFuente: { type: boolean, description: "true = ya existia en la fuente con datos distintos y se actualizo (PUT)" }
                  personaCreadaEnFuente: { type: boolean }
                  empresaId: { type: string, nullable: true, description: FK de la ficha contractual local por RUC }
        "400":
          description: Datos invalidos (documento, correos o campos obligatorios)
        "409":
          description: El correo ya tiene una cuenta habilitada
        "502":
          description: Error de servicio-persona
  /auth/cambiar-password:
    post:
      tags: [Auth]
      summary: Cambia la contraseña temporal (primer ingreso) y reemite la sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passwordActual, passwordNueva]
              properties:
                passwordActual: { type: string }
                passwordNueva: { type: string, minLength: 8 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok, requiereValidarDatos]
                properties:
                  ok: { type: boolean }
                  requiereValidarDatos: { type: boolean, description: "La empresa aún debe validar sus datos" }
        "400":
          description: Contraseña actual incorrecta o nueva inválida
  /portal/empresa/mis-datos:
    get:
      tags: [Portal]
      summary: Datos de la empresa vinculada al usuario autenticado
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmpresaRegistrada"
        "404":
          $ref: "#/components/responses/NotFound"
  /portal/empresa/validar:
    post:
      tags: [Portal]
      summary: Valida/actualiza los datos contractuales de la empresa (primer ingreso)
      description: |
        Exige los datos del representante legal que usa el sistema: nombre, DNI valido,
        correo (usuario del sistema), celular y direccion (la partida es opcional). Si la
        cuenta se creo solo con RUC (correo provisional `acceso-<RUC>@acceso.iimp`), adopta
        el correo del representante como correo de acceso y reemite la sesion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmpresaRegistradaInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmpresaRegistrada"
  /usuarios/listar:
    get:
      tags: [Usuarios]
      summary: Bandeja paginada de accesos del Portal del Cliente
      description: |
        Usuarios locales (incluye internos sin empresa). La persona vive en
        servicio-persona (`sieCode`). Paginacion, busqueda y filtro server-side.
        Requiere `usuarios:manage`.
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
        - in: query
          name: search
          schema: { type: string, maxLength: 200 }
          description: Busca en correo, nombres, empresa (razon social/SIE), rol y sieCode.
        - in: query
          name: filtro
          schema: { type: string, enum: [portal, sin-empresa] }
          description: Vinculo con empresa; omitido = todos.
      responses:
        "200":
          description: Pagina de usuarios
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        email: { type: string }
                        nombre: { type: string, nullable: true }
                        apellidos: { type: string, nullable: true }
                        telefono: { type: string, nullable: true }
                        ruc: { type: string, nullable: true, description: RUC de la empresa vinculada }
                        rol: { type: string }
                        empresaId: { type: string, nullable: true }
                        idEmpresa: { type: string, nullable: true, description: Codigo SIE }
                        empresa: { type: string, nullable: true }
                        esPortal: { type: boolean }
                        sieCode: { type: string, nullable: true }
                        debeCambiarPassword: { type: boolean }
                        flgActivo: { type: boolean, description: false = cuenta deshabilitada }
                  pagination:
                    type: object
                    properties:
                      page: { type: integer }
                      per_page: { type: integer }
                      total: { type: integer }
                      total_pages: { type: integer }
  /usuarios/personas:
    get:
      tags: [Usuarios]
      summary: Busca personas en servicio-persona (apellido paterno o DNI)
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 3 }
      responses:
        "200":
          description: Personas encontradas
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    sie_code: { type: string }
                    apellido_paterno: { type: string, nullable: true }
                    apellido_materno: { type: string, nullable: true }
                    nombres: { type: string, nullable: true }
                    nombre_completo: { type: string, nullable: true }
                    documento: { type: string, nullable: true }
                    correo: { type: string, nullable: true }
                    celular: { type: string, nullable: true }
  /usuarios/crear:
    post:
      tags: [Usuarios]
      summary: Alta individual (persona en servicio-persona + acceso local)
      description: |
        Busca/crea la persona en servicio-persona y persiste el acceso local:
        `sieCode` + correo + empresa (codigo SIE + FK por RUC) + rol. Envia la
        contrasena temporal por correo. Requiere `usuarios:manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idEmpresa, nombreEmpresa, email, tipoDocumento, documento, apellidoPaterno, nombres]
              properties:
                idEmpresa: { type: string, description: Codigo SIE de la empresa }
                nombreEmpresa: { type: string, maxLength: 200 }
                ruc: { type: string, nullable: true, maxLength: 20, description: Si existe ficha local con ese RUC se vincula la FK }
                email: { type: string }
                tipoDocumento: { type: string, enum: ["1", "4", "7"], description: "1 = DNI, 4 = CE, 7 = Pasaporte" }
                documento: { type: string, maxLength: 15 }
                apellidoPaterno: { type: string, maxLength: 30 }
                apellidoMaterno: { type: string, nullable: true, maxLength: 30 }
                nombres: { type: string, maxLength: 30 }
                celular: { type: string, nullable: true, maxLength: 35 }
                direccion: { type: string, nullable: true, maxLength: 100 }
                rolId: { type: string, nullable: true, description: "Rol local; por defecto cliente" }
      responses:
        "201":
          description: Resultado del alta
          content:
            application/json:
              schema:
                type: object
                properties:
                  email: { type: string }
                  creado: { type: boolean }
                  emailEnviado: { type: boolean, nullable: true }
                  error: { type: string, nullable: true }
        "400":
          description: Datos invalidos
  /usuarios/crear-lote:
    post:
      tags: [Usuarios]
      summary: Alta por lote (hasta 100 personas) para la misma empresa y rol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idEmpresa, nombreEmpresa, usuarios]
              properties:
                idEmpresa: { type: string }
                nombreEmpresa: { type: string, maxLength: 200 }
                ruc: { type: string, nullable: true, maxLength: 20 }
                rolId: { type: string, nullable: true }
                usuarios:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [email, tipoDocumento, documento, apellidoPaterno, nombres]
                    properties:
                      email: { type: string }
                      tipoDocumento: { type: string, enum: ["1", "4", "7"] }
                      documento: { type: string, maxLength: 15 }
                      apellidoPaterno: { type: string, maxLength: 30 }
                      apellidoMaterno: { type: string, nullable: true, maxLength: 30 }
                      nombres: { type: string, maxLength: 30 }
                      celular: { type: string, nullable: true, maxLength: 35 }
                      direccion: { type: string, nullable: true, maxLength: 100 }
      responses:
        "200":
          description: Resultado por fila
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultados:
                    type: array
                    items:
                      type: object
                      properties:
                        email: { type: string }
                        creado: { type: boolean }
                        emailEnviado: { type: boolean, nullable: true }
                        error: { type: string, nullable: true }
  /usuarios/crear-cuenta:
    post:
      tags: [Usuarios]
      summary: Crea el acceso para una persona existente en servicio-persona
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idEmpresa, nombreEmpresa, sieCode, email]
              properties:
                idEmpresa: { type: string }
                nombreEmpresa: { type: string, maxLength: 200 }
                ruc: { type: string, nullable: true, maxLength: 20 }
                sieCode: { type: string, description: sie_code de la persona en servicio-persona }
                email: { type: string }
                rolId: { type: string, nullable: true }
      responses:
        "201":
          description: Resultado del alta
          content:
            application/json:
              schema:
                type: object
                properties:
                  email: { type: string }
                  creado: { type: boolean }
                  emailEnviado: { type: boolean, nullable: true }
                  error: { type: string, nullable: true }
  /usuarios/actualizar:
    post:
      tags: [Usuarios]
      summary: Actualiza el acceso local (correo del login, estado y/o empresa)
      description: |
        Actualización parcial: enviar al menos uno de `email`, `flgActivo` o la
        pareja `idEmpresa`+`nombreEmpresa`. `flgActivo: false` deshabilita la
        cuenta (bloquea el login y corta su sesión activa); un admin no puede
        deshabilitar su propia cuenta. Al cambiar `email` también cambia el
        `userId` (`user|<email>`) y la sesión activa del usuario se cierra.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string }
                email: { type: string, nullable: true, description: Nuevo correo del acceso (login) }
                flgActivo: { type: boolean, nullable: true, description: false deshabilita la cuenta }
                idEmpresa: { type: string, nullable: true, description: Codigo SIE (junto con nombreEmpresa) }
                nombreEmpresa: { type: string, maxLength: 200, nullable: true }
                ruc: { type: string, nullable: true, maxLength: 20, description: Resuelve la FK local de la empresa por RUC }
      responses:
        "200":
          description: Usuario actualizado
        "409":
          description: El correo ya pertenece a otra cuenta
  /usuarios/enviar-accesos:
    post:
      tags: [Usuarios]
      summary: Regenera la contrasena temporal y reenvia las credenciales
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string }
      responses:
        "200":
          description: Credenciales regeneradas
          content:
            application/json:
              schema:
                type: object
                properties:
                  email: { type: string }
                  emailEnviado: { type: boolean }
  /reserva-datos/prellenar:
    get:
      tags: [Usuarios]
      summary: Prellenado del wizard de reserva con datos del propio usuario (self-only)
      description: |
        Devuelve datos de la persona (`sie_code`) o de la empresa (`id_empresa`) del
        usuario logueado, leidos de servicio-persona. Si el documento consultado no
        pertenece al usuario, devuelve `{}` (privacidad).
      parameters:
        - name: tipoDocumento
          in: query
          required: true
          schema: { type: string, enum: ["1", "6"], description: "1 = DNI, 6 = RUC" }
        - name: numeroDocumento
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Datos de prellenado (vacio si no aplica)
          content:
            application/json:
              schema:
                type: object
                properties:
                  contacto: { type: string }
                  direccion: { type: string }
                  telefono: { type: string }
                  correo: { type: string }
  /auth/idioma:
    patch:
      tags: [Auth]
      summary: Guarda el idioma preferido del usuario (selector ES/EN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idioma]
              properties:
                idioma: { type: string, enum: [es, en] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [idioma]
                properties:
                  idioma: { type: string, enum: [es, en] }
        "400":
          description: Idioma no soportado
  /facturacion/adjuntar-comprobante:
    post:
      tags: [Facturacion]
      summary: Adjunta el comprobante fiscal (boleta/factura) de una cuota pagada y notifica al cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cuotaId, tipo, numero, url]
              properties:
                cuotaId: { type: string, format: uuid }
                tipo: { type: string, enum: [factura, boleta] }
                numero: { type: string, maxLength: 30 }
                url: { type: string, maxLength: 500, description: URL devuelta por /api/upload }
      responses:
        "200":
          description: OK
        "400":
          description: Datos invalidos
        "403":
          description: Sin permiso de facturacion
        "404":
          description: Cuota no encontrada
        "409":
          description: La cuota no esta pagada
  /pagos/solicitar-factura:
    post:
      tags: [Facturacion]
      summary: Registra la reserva en el IIMP y emite la factura/boleta de la 1ra cuota
      description: >
        Llama a `POST /stands/reserva` del IIMP (reserva stands + contrato + cuenta corriente +
        comprobante de la 1ra cuota) con la empresa del usuario. Guarda contrato y documento.
        No idempotente del lado del IIMP; si la solicitud ya tiene contrato registrado responde 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cuotaId]
              properties:
                cuotaId: { type: string, format: uuid }
      responses:
        "200":
          description: Reserva registrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  contrato: { type: string, description: Numero de contrato IIMP (10 digitos) }
                  cuentaCorriente: { type: integer, description: Numero de cuenta corriente en el IIMP }
                  documento:
                    type: object
                    nullable: true
                    description: Comprobante de la 1ra cuota; null si el IIMP no lo devolvio
                    properties:
                      tipoDocumento: { type: string, description: "01 Factura / 03 Boleta" }
                      serie: { type: string }
                      numero: { type: integer }
                      fechaEmision: { type: string, description: AAAA-MM-DD }
                      tipoCambio: { type: string }
                      igv: { type: string }
                      total: { type: string }
        "400":
          description: Validacion (empresa, RUC, direccion fiscal, evento, stands o cuotas)
        "403":
          description: Sin acceso a esta cuota
        "404":
          description: Cuota o solicitud no encontrada / evento inexistente en el IIMP
        "409":
          description: Reserva ya registrada o stands ya reservados en el IIMP
        "502":
          description: Error o sesion vencida del API del IIMP
  /pagos/archivos:
    get:
      tags: [Facturacion]
      summary: Documentos (links) de la cuenta corriente del IIMP de la reserva de una cuota
      parameters:
        - name: cuotaId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Lista de documentos
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    item: { type: integer, description: Posicion del archivo en la cuenta corriente }
                    tipo: { type: string, description: "OC | HES | DETRACCION | DIFERENCIA | PAGO_TOTAL | VALORIZACION_COTIZACION" }
                    cuota: { type: integer, nullable: true }
                    link: { type: string }
                    nombre: { type: string, nullable: true }
                    fecha: { type: string, description: AAAA-MM-DD }
        "403":
          description: Sin acceso a esta cuota
        "404":
          description: Cuota o cuenta corriente no encontrada
        "502":
          description: Error o sesion vencida del API del IIMP
  /pagos/archivos-agregar:
    post:
      tags: [Facturacion]
      summary: Agrega un documento a la cuenta corriente del IIMP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cuotaId, tipo, link]
              properties:
                cuotaId: { type: string, format: uuid }
                tipo: { type: string, description: "OC | HES | DETRACCION | DIFERENCIA | PAGO_TOTAL | VALORIZACION_COTIZACION" }
                cuota: { type: integer, nullable: true, description: Obligatoria para DETRACCION y DIFERENCIA }
                link: { type: string }
                nombre: { type: string, nullable: true }
      responses:
        "200":
          description: Documentos actualizados de la cuenta corriente
        "400":
          description: Validacion (tipo, cuota, link)
        "403":
          description: Sin acceso a esta cuota
        "502":
          description: Error o sesion vencida del API del IIMP
  /pagos/archivos-eliminar:
    post:
      tags: [Facturacion]
      summary: Quita un documento de la cuenta corriente del IIMP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cuotaId, item]
              properties:
                cuotaId: { type: string, format: uuid }
                item: { type: integer, description: Posicion del archivo }
      responses:
        "200":
          description: Documentos actualizados de la cuenta corriente
        "403":
          description: Sin acceso a esta cuota
        "502":
          description: Error o sesion vencida del API del IIMP
  /integracion/factura:
    post:
      tags: [Integracion]
      summary: API entrante M2M del sistema de facturacion (SIE) — documento y estado de pago de una cuota
      description: >
        Autenticacion por header `x-api-key` (clave compartida; en local/tunel no se exige).
        Localiza la cuota por `numeroSolicitud` (o `contrato`) + numero de cuota.
        `estadoPago`: 0 PAGADA, 1 PENDIENTE (incluye pagos parciales), 2 ANULADA o rechazo
        (limpia el documento de la cuota; no revierte el pago). Cada notificacion reemplaza
        la anterior (sin Idempotency-Key). Guia completa: docs/05-integraciones/api-facturacion-entrante.md.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cuota, documento, estadoPago]
              properties:
                numeroSolicitud: { type: string, description: Uno de numeroSolicitud/contrato }
                contrato: { type: string, description: Alternativa a numeroSolicitud }
                cuota: { type: integer, minimum: 1 }
                documento: { type: string, maxLength: 250, description: Nombre del documento (no el archivo) }
                estadoPago: { type: integer, enum: [0, 1, 2] }
                justificacion: { type: string, maxLength: 500, description: "Motivo de la anulacion/rechazo; obligatoria cuando estadoPago es 2" }
      responses:
        "200":
          description: Notificacion registrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  cuotaId: { type: string, format: uuid }
                  numero: { type: integer }
                  documento: { type: string }
                  estadoPago: { type: integer }
        "400":
          description: Validacion (numeroSolicitud/contrato, cuota, documento, estadoPago y justificacion obligatoria en 2)
        "401":
          description: Clave x-api-key ausente o invalida
        "404":
          description: Solicitud activa, facturacion o cuota no encontrada
  /sgc/detalle:
    get:
      tags: [SGC]
      summary: Detalle del expediente SGC de una solicitud (stepper + historial)
      parameters:
        - name: solicitudId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SgcExpedienteDetalle"
        "404":
          $ref: "#/components/responses/NotFound"
  /sgc/descarga:
    get:
      tags: [SGC]
      summary: Enlace de descarga (vida corta) del contrato firmado vigente
      parameters:
        - name: solicitudId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SgcUrlDescarga"
        "404":
          $ref: "#/components/responses/NotFound"
  /sgc/sincronizar:
    post:
      tags: [SGC]
      summary: Reconciliación — refresca el estado de los expedientes creados
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [sincronizados]
                properties:
                  sincronizados: { type: integer }
  /sgc/subsanar:
    post:
      tags: [SGC]
      summary: Empuja una versión corregida del contrato (subsanación)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [solicitudId, documentId, url]
              properties:
                solicitudId: { type: string, format: uuid }
                documentId: { type: string }
                url: { type: string }
                title: { type: string }
      responses:
        "200":
          description: OK
  /sgc/subsanacion-motivo:
    post:
      tags: [SGC]
      summary: Declara la casuística de subsanación (el admin elige el flujo de corrección)
      description: |
        Cuando el SGC devuelve (observed) o rechaza (rejected) el trámite, el administrador
        declara qué corregir. El `modo` define el flujo del cliente:
        - `nuevo_contrato`: el admin subirá una versión corregida; el cliente **espera**
          (no puede firmar el contrato observado) hasta que el contrato nuevo esté adjunto.
        - `mismo_contrato`: el cliente vuelve a firmar el contrato vigente de inmediato.
        Sin `modo` (null) el cliente puede firmar (comportamiento legacy).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [solicitudId]
              properties:
                solicitudId: { type: string, format: uuid }
                motivo: { type: string, maxLength: 500, nullable: true }
                modo:
                  type: string
                  nullable: true
                  enum: [nuevo_contrato, mismo_contrato]
      responses:
        "200":
          description: OK
        "404":
          $ref: "#/components/responses/NotFound"
  /sgc/reenviar:
    post:
      tags: [SGC]
      summary: Reenvía al SGC con el contrato firmado del cliente (reabre la ronda)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [solicitudId]
              properties:
                solicitudId: { type: string, format: uuid }
      responses:
        "200":
          description: OK
        "400":
          description: Falta el contrato firmado del cliente
        "404":
          $ref: "#/components/responses/NotFound"
  /integracion/sgc/webhook:
    post:
      tags: [SGC]
      summary: Receptor de webhooks del SGC (firma HMAC-SHA256)
      security: []
      parameters:
        - name: x-sgc-signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
