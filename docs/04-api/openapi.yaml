  /debida-diligencia/matriz-evaluacion:
    get:
      tags: [DebidaDiligencia]
      summary: Lista de la Matriz de evaluacion DD (un vinculo empresa/persona por fila)
      description: >
        Requiere `dd:matriz` y un evento activo en la sesion. Antes de listar sincroniza las filas
        automaticas (empresa, representante y beneficiarios de cada expediente enviado del evento);
        la sincronizacion es idempotente y `nuevas` indica cuantas filas creo.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: search, in: query, schema: { type: string } }
        - { name: tipo, in: query, schema: { type: string, enum: [empresa, representante, beneficiario, vinculado] } }
        - { name: ambito, in: query, schema: { type: string, enum: [nacional, extranjero] } }
        - { name: pais, in: query, description: Pais ISO alpha-2 exacto, schema: { type: string, minLength: 2, maxLength: 2 } }
        - { name: sinPais, in: query, description: Solo vinculos sin pais conocido, schema: { type: boolean } }
        - { name: resultadoFinal, in: query, schema: { type: string } }
        - { name: sinEvaluar, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DdMatrizEvaluacionResponse"
  /debida-diligencia/matriz-evaluacion/resumen:
    get:
      tags: [DebidaDiligencia]
      summary: Indicadores (stats) de la Matriz de evaluacion DD del evento activo
      description: Conteos por resultado final, ambito, tipo de vinculo, pais y avance por area (SIG, Reputacional, Compliance).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      total: { type: integer }
                      resultadoFinal: { type: array, items: { $ref: "#/components/schemas/DdMatrizConteo" } }
                      ambito: { type: array, items: { $ref: "#/components/schemas/DdMatrizConteo" } }
                      tipo: { type: array, items: { $ref: "#/components/schemas/DdMatrizConteo" } }
                      sig: { type: array, items: { $ref: "#/components/schemas/DdMatrizConteo" } }
                      reputacional: { type: array, items: { $ref: "#/components/schemas/DdMatrizConteo" } }
                      compliance: { type: array, items: { $ref: "#/components/schemas/DdMatrizConteo" } }
                      paises:
                        type: array
                        items:
                          type: object
                          properties:
                            pais: { type: string }
                            total: { type: integer }
                      requierenReforzada: { type: integer }
                      pendientesCompliance: { type: integer }
                      enRevision: { type: integer }
  /debida-diligencia/matriz-evaluacion/exportar:
    post:
      tags: [DebidaDiligencia]
      summary: Datos completos de los vinculos para el Excel oficial de la matriz
      description: >
        Con `ids` devuelve solo esos vinculos; sin `ids` aplica los mismos filtros de la lista. Cada fila trae
        los datos generales de la empresa y las respuestas de listas del vinculo; el cliente arma el .xlsx con
        las 54 columnas (A-BB) de la matriz oficial. Maximo 5000 vinculos. Queda en auditoria.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, items: { type: string }, maxItems: 5000 }
                search: { type: string }
                tipo: { type: string, enum: [empresa, representante, beneficiario, vinculado] }
                ambito: { type: string, enum: [nacional, extranjero] }
                pais: { type: string, minLength: 2, maxLength: 2 }
                sinPais: { type: boolean }
                resultadoFinal: { type: string }
                sinEvaluar: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      data: { type: array, items: { type: object } }
                      total: { type: integer }
        "400":
          description: Supera el maximo de vinculos por exportacion
  /debida-diligencia/matriz-evaluacion/abrir:
    get:
      tags: [DebidaDiligencia]
      summary: Id de la fila de la empresa de un expediente en la Matriz de evaluacion DD
      description: Sincroniza la matriz del evento activo y devuelve el id para abrir el detalle (404 si el expediente aun es borrador).
      parameters:
        - { name: expedienteId, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
