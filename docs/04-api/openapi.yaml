        moneda: { type: string, example: USD }
        contratoUrl: { type: string }
    PlanoStand:
      type: object
      required: [standId, numero, x, y, estado]
      properties:
        standId: { type: string }
        numero: { type: string, example: "01" }
        tipoStand: { type: string, example: isla }
        monto: { type: number, example: 12000 }
        tipoCamara: { type: string }
        numeroCamara: { type: string }
        x: { type: number }
        y: { type: number }
        estado: { $ref: "#/components/schemas/EstadoStand" }
        empresa: { type: string, description: "Visible solo si está reservado" }
    Cuota:
      type: object
      required: [numero, porcentaje]
      properties:
        numero: { type: integer, example: 1 }
        porcentaje: { type: number, example: 40 }
        monto: { type: number }
        fechaPago: { type: string, format: date }
    DatosFacturacion:
      type: object
      required: [tipoComprobante]
      properties:
        tipoComprobante: { $ref: "#/components/schemas/TipoComprobante" }
        razonSocial: { type: string }
        ruc: { type: string }
        nombre: { type: string }
        numeroDocumento: { type: string }
        direccion: { type: string }
        correo: { type: string, format: email }
    ReservaCreate:
      type: object
      required: [eventoId, standIds, empresaRef, facturacion]
      properties:
        eventoId: { type: string }
        standIds:
          type: array
          minItems: 1
          items: { type: string }
        empresaRef: { type: string, description: "Id externo de empresa (John/Niel)" }
        facturacion: { $ref: "#/components/schemas/DatosFacturacion" }
        cuotas:
          type: array
          items: { $ref: "#/components/schemas/Cuota" }
    Aprobacion:
      type: object
      properties:
        area:
          type: string
          enum: [legal, logistica, eventos]
        estado:
          type: string
          enum: [pendiente, aprobado, rechazado]
        responsable: { type: string }
        comentario: { type: string }
        fecha: { type: string, format: date-time }
    AprobacionInput:
      type: object
      required: [area, estado]
      properties:
        area:
          type: string
          enum: [legal, logistica, eventos]
        estado:
          type: string
          enum: [aprobado, rechazado]
        comentario: { type: string }
    Reserva:
      type: object
      required: [id, eventoId, estado]
      properties:
        id: { type: string }
        eventoId: { type: string }
        empresaRef: { type: string }
        standIds:
          type: array
          items: { type: string }
        facturacion: { $ref: "#/components/schemas/DatosFacturacion" }
        cuotas:
          type: array
          items: { $ref: "#/components/schemas/Cuota" }
        aprobaciones:
          type: array
          items: { $ref: "#/components/schemas/Aprobacion" }
        estado: { $ref: "#/components/schemas/EstadoReserva" }
        creadoEn: { type: string, format: date-time }
    InteropFacturacion:
      type: object
      properties:
        reservaId: { type: string }
        estado:
          type: string
          enum: [enviado, confirmado, error]
        ordenVenta: { type: string }
        comprobante: { type: string }
    InteropCallback:
      type: object
      required: [reservaId, estado]
      properties:
        reservaId: { type: string }
        estado:
          type: string
          enum: [confirmado, error]
        ordenVenta: { type: string }
        comprobante: { type: string }
        standsOcupados:
          type: array
          items: { type: string }
    Empresa:
      type: object
      properties:
        id: { type: string }
        razonSocial: { type: string }
        ruc: { type: string }
        origen:
          type: string
          enum: [john, niel, local]
    EmpresaRegistradaInput:
      type: object
      required: [ruc, razonSocial]
      properties:
        ruc: { type: string, minLength: 11, maxLength: 11 }
        pais: { type: string, minLength: 2, maxLength: 2, description: "Codigo ISO 3166-1 alpha-2 (default PE)" }
        razonSocial: { type: string, maxLength: 200 }
        sieCode: { type: string, nullable: true, maxLength: 20, description: "Codigo SIE ya conocido (padron IIMP): evita crear/consultar en servicio-persona" }
        nombreComercial: { type: string, nullable: true, maxLength: 200 }
        direccionFiscal: { type: string, nullable: true, maxLength: 250 }
        telefono: { type: string, nullable: true, maxLength: 30 }
        emailContacto: { type: string, nullable: true, format: email }
        emailFacturacion: { type: string, nullable: true, format: email }
        nombreFriso: { type: string, nullable: true, maxLength: 200, description: "Nombre que se imprime en el friso del stand" }
        actividadEconomica: { type: string, nullable: true, maxLength: 200 }
        estadoContribuyente: { type: string, nullable: true, maxLength: 80, description: "Estado / condicion SUNAT" }
        facturarANombre: { type: string, nullable: true, maxLength: 200 }
        responsableExteminNombre: { type: string, nullable: true, maxLength: 200 }
        responsableExteminTelefono: { type: string, nullable: true, maxLength: 35 }
        responsableExteminTipoDocumento: { type: string, enum: ["1", "4", "7"], default: "1" }
        responsableExteminDni: { type: string, nullable: true, maxLength: 15 }
        responsableExteminEmail: { type: string, nullable: true, format: email }
        responsablePagosNombre: { type: string, nullable: true, maxLength: 200 }
        responsablePagosTelefono: { type: string, nullable: true, maxLength: 35 }
        responsablePagosTipoDocumento: { type: string, enum: ["1", "4", "7"], default: "1" }
        responsablePagosDni: { type: string, nullable: true, maxLength: 15 }
        responsablePagosEmail: { type: string, nullable: true, format: email }
        representanteLegalNombre: { type: string, nullable: true, maxLength: 200 }
        representanteLegalTipoDocumento: { type: string, enum: ["1", "4", "7"], default: "1" }
        representanteLegalDni: { type: string, nullable: true, maxLength: 15 }
        representanteCorreo: { type: string, nullable: true, format: email, description: "Correo del representante legal (solo local; el admin lo sincroniza con servicio-persona)" }
        representanteCelular: { type: string, nullable: true, maxLength: 35 }
        representanteDireccion: { type: string, nullable: true, maxLength: 100 }
        partidaElectronica: { type: string, nullable: true, maxLength: 50 }
        tipoComprobante: { type: string, enum: [factura, boleta], default: factura }
        sitioWeb: { type: string, nullable: true, maxLength: 200 }
    EmpresaRegistrada:
      allOf:
        - $ref: "#/components/schemas/EmpresaRegistradaInput"
        - type: object
          properties:
            id: { type: string, format: uuid }
            estado: { type: string, enum: [activa, inactiva] }
            cuentaCreada: { type: boolean }
            cuentaEmail: { type: string, nullable: true, description: "Correo de acceso de la cuenta vinculada (acceso-<RUC>@acceso.iimp si es solo RUC)" }
            representanteSieCode: { type: string, nullable: true, description: "Codigo SIE de la persona del representante en servicio-persona (null = aun solo local, pendiente de sincronizar)" }
            primerAccesoCompletado: { type: boolean }
            datosValidadosEn: { type: string, format: date-time, nullable: true }
            creadoPor: { type: string, nullable: true }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    FilaCargaEmpresa:
      type: object
      required: [numero]
      properties:
        numero: { type: integer, description: "Fila del archivo (1 = encabezado)" }
        ruc: { type: string }
        razonSocial: { type: string }
        nombreComercial: { type: string }
        direccionFiscal: { type: string }
        telefono: { type: string }
        emailContacto: { type: string }
        emailFacturacion: { type: string }
        representanteLegalNombre: { type: string }
        representanteLegalDni: { type: string }
        tipoComprobante: { type: string }
        sitioWeb: { type: string }
    PrevisualizacionCargaEmpresas:
      type: object
      required: [filas, resumen]
      properties:
        filas:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/FilaCargaEmpresa"
              - type: object
                required: [estado, mensajes]
                properties:
                  estado: { type: string, enum: [lista, advertencia, error] }
                  mensajes: { type: array, items: { type: string } }
        resumen:
          type: object
          required: [listas, advertencias, errores]
          properties:
            listas: { type: integer }
            advertencias: { type: integer }
            errores: { type: integer }
    ResultadoCredencialesEmpresa:
      type: object
      required: [email, usuario, passwordTemporal, emailEnviado]
      properties:
        email: { type: string, description: "Correo de la cuenta (provisional acceso-<ruc>@acceso.iimp si es solo-RUC)" }
        usuario: { type: string, description: "Usuario de acceso (RUC para cuentas solo-RUC)" }
        passwordTemporal: { type: string, description: "Contrasena temporal (se muestra una vez al administrador)" }
        emailEnviado: { type: boolean, nullable: true, description: "True si el correo con las credenciales salió" }
    ApiError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string }
        detalles:
          type: array
          items: { type: string }
    GessStand:
      type: object
      required: [id, eventoId, standApiId, standCode]
      properties:
        id: { type: string }
        eventoId: { type: string }
        standApiId: { type: string, description: "UID del stand en el API externo" }
        standCode: { type: string, description: "Código visible (01, 02, ...)" }
        tipoStand: { type: string, nullable: true, example: "PREFERENCIAL" }
        medidas: { type: string, nullable: true, example: "3000.00 US$" }
        estado: { type: string, nullable: true, example: "Reservado" }
        empresa: { type: string, nullable: true, example: "CETEMIN" }
        pabellon: { type: string, nullable: true }
        ubicacion: { type: string, nullable: true }
        bloqueId: { type: string, nullable: true, description: "ID del bloque 3D vinculado" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    GessSyncResult:
      type: object
      required: [creados, actualizados, total]
      properties:
        creados: { type: integer }
        actualizados: { type: integer }
        total: { type: integer }
    SgcCompletedBy:
      type: object
      properties:
        actorName: { type: string }
        areaName: { type: string }
        completedAt: { type: string, format: date-time }
        constancy: { type: string, enum: [acknowledgement, visa, normal-signature, stamp] }
    SgcStep:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        kind: { type: string }
        position: { type: integer }
        status: { type: string, enum: [completed, current, pending] }
        areaId: { type: string, nullable: true }
        completedBy:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/SgcCompletedBy"
    SgcHistoryItem:
      type: object
      properties:
        id: { type: string }
        source: { type: string }
        title: { type: string }
        detail: { type: string }
        actorName: { type: string }
        occurredAt: { type: string, format: date-time }
    SgcDocumentoResumen:
      type: object
      properties:
        documentId: { type: string }
        category: { type: string, enum: [contract, annex] }
        title: { type: string }
        currentVersionId: { type: string, nullable: true }
    SgcExpedienteDetalle:
      type: object
      properties:
        contractId: { type: string }
        code: { type: string }
        name: { type: string }
        stage: { type: string, enum: [drafting, internal-review, approval, validity, closed] }
        lifecycleStatus: { type: string, nullable: true, enum: [active, finalized, observed, rejected] }
        areaName: { type: string, nullable: true }
        contractTypeName: { type: string, nullable: true }
        counterpartyName: { type: string, nullable: true }
        counterpartyEmail: { type: string, nullable: true }
        counterpartyTaxIdentifier: { type: string, nullable: true }
        currency: { type: string, nullable: true }
        totalMinorUnits: { type: integer, nullable: true }
        startDate: { type: string, nullable: true }
        endDate: { type: string, nullable: true }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        documents:
          type: array
          items: { $ref: "#/components/schemas/SgcDocumentoResumen" }
        steps:
          type: array
          items: { $ref: "#/components/schemas/SgcStep" }
        history:
          type: array
          items: { $ref: "#/components/schemas/SgcHistoryItem" }
    SgcUrlDescarga:
      type: object
      required: [url, expiresInSeconds]
      properties:
        url: { type: string }
        expiresInSeconds: { type: integer }
    SgcWebhookPayload:
      type: object
      required: [apiVersion, eventId, eventType, createdAt, resource, data]
      properties:
        apiVersion: { type: string }
        eventId: { type: string }
        eventType:
          type: string
          enum: [workflow.started, workflow.advanced, workflow.returned, workflow.approved, workflow.rejected, contract.closed]
        createdAt: { type: string, format: date-time }
        resource:
          type: object
          properties:
            id: { type: string }
            type: { type: string }
            code: { type: string, nullable: true }
        data: { type: object, additionalProperties: true }
