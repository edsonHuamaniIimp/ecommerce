            type: string
        - name: documento
          in: query
          schema:
            type: string
        - name: resultado
          in: query
          schema:
            type: string
            enum: [apto, apto_con_observaciones, no_apto, pendiente]
        - name: estadoEvaluacion
          in: query
          schema:
            type: string
            enum: [vigente, requiere_nueva_evaluacion]
        - name: evento
          in: query
          schema:
