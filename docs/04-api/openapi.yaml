  /debida-diligencia/clientes:
    get:
      tags: [DebidaDiligencia]
      summary: Clientes con evaluacion DD, resultado institucional y vigencia
      description: |
        Devuelve las evaluaciones del evento de la sesion. El resultado se calcula
        a partir del workflow: APTO, APTO CON OBSERVACIONES, NO APTO o PENDIENTE.
        El estado de evaluacion es VIGENTE o REQUIERE NUEVA EVALUACION.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: perPage
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: search
          in: query
          schema:
            type: string
        - name: ruc
          in: query
          schema:
            type: string
        - name: estado
          in: query
          schema:
            type: string
            enum: [borrador, pendiente, en_revision, observada, aprobada, rechazada]
        - name: resultado
          in: query
          schema:
            type: string
            enum: [apto, apto_con_observaciones, no_apto, pendiente]
        - name: estadoEvaluacion
          in: query
          schema:
            type: string
            enum: [vigente, requiere_nueva_evaluacion]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DdClientesResponse"
        "401":
          description: No autorizado
        "403":
          description: Sin permiso dd:ver
  /debida-diligencia/empresas:
    get:
      tags: [DebidaDiligencia]
      summary: Empresas con estado consolidado de Debida Diligencia
      description: |
        Registro oficial de empresas con su resultado DD y vigencia. Las empresas
        pendientes pueden reservar, pero solo las APTAS y VIGENTES pueden avanzar.
      parameters:
        - name: page
          in: query
