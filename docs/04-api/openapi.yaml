openapi: 3.0.3
info:
  title: ContratosStands API (IIMP)
  version: 0.1.0-draft
  description: >
    API del sistema **ContratosStands** — handler/procesador de reservas de stands
    para eventos IIMP (Perumin, ProExplo, WMC, GESS). BORRADOR derivado del onboarding
    técnico; los contratos con el sistema de facturación (John/SAP) están **por
    confirmar**. Este documento es la fuente de verdad (Swagger/OpenAPI) de la API.
  contact:
    name: Equipo ContratosStands
servers:
  - url: http://localhost:3000/api
    description: Desarrollo local
  - url: https://dev.contratos-stands.iimp/api
    description: Ambiente Dev (PC)
  - url: https://qa.contratos-stands.iimp/api
    description: Ambiente QA (PC)
tags:
  - name: Eventos
    description: Eventos padre y versiones (multievento)
  - name: Plano
    description: Plano interactivo y stands
  - name: Gess
    description: Stands del evento (catálogo local) e integración con el API de stands del IIMP (liststand)
  - name: Reservas
    description: Registro y consulta de reservas
  - name: Aprobaciones
    description: Flujo Legal -> Logística -> Eventos/Asociados
  - name: Facturacion
    description: Interoperabilidad con facturación (SAP/John)
  - name: Empresas
    description: Consumo (proxy) de empresas/personas
  - name: SGC
    description: Integración con el Sistema de Gestión de Contratos (expediente, documentos, descarga, webhooks)
security:
  - bearerAuth: []
paths:
  /eventos-padre:
    get:
      tags: [Eventos]
      summary: Lista los eventos padre (verticales)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventoPadre"
  /eventos:
    get:
      tags: [Eventos]
      summary: Lista eventos (versiones) por evento padre
      parameters:
        - name: eventoPadreId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Evento"
  /eventos/{eventoId}/plano:
    get:
      tags: [Plano]
      summary: Devuelve los stands con posición X/Y y estado para el plano interactivo
      parameters:
        - $ref: "#/components/parameters/EventoId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanoStand"
        "404":
          $ref: "#/components/responses/NotFound"
  /eventos/{eventoId}/tipos-stand:
    get:
      tags: [Plano]
      summary: Lista los tipos de stand del evento (con monto y contrato)
      parameters:
        - $ref: "#/components/parameters/EventoId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TipoStand"
  /gess:
    get:
      tags: [Gess]
      summary: Lista stands GESS vinculados o busca por bloqueId
      parameters:
        - name: eventoId
          in: query
          schema:
            type: string
        - name: bloqueId
          in: query
          description: ID del bloque del plano isométrico (EXT-IZQ-01, ...)
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/GessStand"
                  - $ref: "#/components/schemas/GessStand"
                  - type: "null"
    patch:
      tags: [Gess]
      summary: Vincula o desvincula un stand GESS a un bloque del plano isométrico
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string }
                bloqueId:
                  type: string
                  nullable: true
                  description: ID del bloque 3D o null para desvincular
      responses:
        "200":
          description: Vínculo actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GessStand"
  /gess/sync:
    post:
      tags: [Gess]
      summary: Sincroniza stands del API de stands del IIMP (liststand) hacia la BD local (upsert por eventoId+standApiId)
      description: |
        Actualiza `tipoStand`, `medidas`, `pabellon` y `rawData`. En re-importación conserva el
        estado local (`en_evaluacion`/`reservado`) si el API reporta `LIBRE`, no pisa la empresa
        con vacío y no toca `bloqueId`, documentos ni imágenes. Ver
        `docs/05-integraciones/integracion-liststand.md`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventoId]
              properties:
                eventoId: { type: string }
                tipoEvento:
                  type: integer
                  description: TipEvCod del evento versión (API del IIMP)
                codigoEvento:
                  type: integer
                  description: EvenCod del evento versión (API del IIMP)
                seleccionadas:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
      responses:
        "200":
          description: Resultado de la sincronización
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GessSyncResult"
  /gess/pre-reservar:
    post:
      tags: [Gess]
      summary: Pre-reserva stands disponibles en lote (empresa o título; bloqueo sin solicitud ni contrato)
      description: |
        Todo o nada: si algún stand no está `disponible` responde 409 y no modifica ninguno.
        El estado pasa a `pre_reservado` (se comporta como reservado en el plano) y se guarda
        el snapshot de la empresa (razón social, RUC, SIE) **o** el título libre, además de nota
        y autor. Al menos uno de `razonSocial`/`titulo` es obligatorio; lo registrado se muestra
        en el hover del plano.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [standIds]
              properties:
                standIds:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { type: string }
                razonSocial: { type: string, nullable: true, maxLength: 200 }
                titulo: { type: string, nullable: true, maxLength: 200, description: Alternativa libre a la empresa; se muestra en el hover }
                ruc: { type: string, nullable: true, maxLength: 20 }
                sie: { type: string, nullable: true, maxLength: 20, description: Código SIE de entidades (ej. E0000003804) }
                nota: { type: string, nullable: true, maxLength: 300 }
      responses:
        "200":
          description: Pre-reservas aplicadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  preReservados: { type: integer }
        "400":
          description: Datos inválidos (sin stands o sin razón social/título)
        "403":
          description: Sin permisos para gestionar pre-reservas
        "409":
          description: Algún stand no está disponible (no se modificó ninguno)
  /gess/liberar:
    post:
      tags: [Gess]
      summary: Libera pre-reservas en lote (vuelven a `disponible` y se limpia la empresa asignada)
      description: Todo o nada: si algún stand no está `pre_reservado` responde 409 y no modifica ninguno.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [standIds]
              properties:
                standIds:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { type: string }
      responses:
        "200":
          description: Pre-reservas liberadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  liberados: { type: integer }
        "403":
          description: Sin permisos para gestionar pre-reservas
        "409":
          description: Algún stand no está pre-reservado (no se modificó ninguno)
  /gess/pre-reserva:
    patch:
      tags: [Gess]
      summary: Edita empresa/título/logo/nota de una pre-reserva vigente (stand `pre_reservado`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [standId]
              properties:
                standId: { type: string }
                razonSocial: { type: string, nullable: true, maxLength: 200 }
                titulo: { type: string, nullable: true, maxLength: 200, description: Alternativa libre a la empresa; null lo limpia }
                ruc: { type: string, nullable: true, maxLength: 20 }
                sie: { type: string, nullable: true, maxLength: 20 }
                logoUrl: { type: string, nullable: true, maxLength: 500, description: "null limpia el logo" }
                nota: { type: string, nullable: true, maxLength: 300, description: "null limpia la nota" }
      responses:
        "200":
          description: Pre-reserva actualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  actualizado: { type: boolean }
        "403":
          description: Sin permisos para gestionar pre-reservas
        "404":
          description: Stand no encontrado
        "409":
          description: El stand no está pre-reservado
  /planogess/fetch:
    post:
      tags: [Gess]
      summary: Lista los stands del evento desde el API del IIMP (liststand) para el preview de Vinculación
      description: |
        Login con cuenta técnica (acceso VTA) + `POST /stands/liststand`. Devuelve filas aplanadas
        (`stand`, `pabellon`, `tipo`, `area`, `precio`, `estado`, `moneda`, `orden`). Solo lectura.
        Ver `docs/05-integraciones/integracion-liststand.md`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipoEvento, codigoEvento]
              properties:
                tipoEvento:
                  type: integer
                  description: TipEvCod del evento versión
                codigoEvento:
                  type: integer
                  description: EvenCod del evento versión
      responses:
        "200":
          description: Filas de stands del evento
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
  /reservas:
    post:
      tags: [Reservas]
      summary: Registra una reserva de uno o varios stands
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservaCreate"
      responses:
        "201":
          description: Reserva registrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reserva"
        "409":
          description: Uno o más stands ya no están disponibles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          $ref: "#/components/responses/ValidationError"
    get:
      tags: [Reservas]
      summary: Lista reservas (dashboard)
      parameters:
        - name: eventoId
          in: query
          schema:
            type: string
        - name: estado
          in: query
          schema:
            $ref: "#/components/schemas/EstadoReserva"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reserva"
  /reservas/{reservaId}:
    get:
      tags: [Reservas]
      summary: Detalle de una reserva
      parameters:
        - $ref: "#/components/parameters/ReservaId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reserva"
        "404":
          $ref: "#/components/responses/NotFound"
  /reservas/{reservaId}/contrato:
    get:
      tags: [Reservas]
      summary: Descarga el formato de contrato (PDF) según el tipo de stand
      parameters:
        - $ref: "#/components/parameters/ReservaId"
      responses:
        "200":
          description: PDF del contrato
          content:
            application/pdf:
              schema:
                type: string
                format: binary
  /reservas/{reservaId}/aprobaciones:
    post:
      tags: [Aprobaciones]
      summary: Registra la resolución de un área (Legal/Logística/Eventos)
      parameters:
        - $ref: "#/components/parameters/ReservaId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AprobacionInput"
      responses:
        "200":
          description: Aprobación registrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reserva"
  /reservas/{reservaId}/facturacion:
    post:
      tags: [Facturacion]
      summary: Envía la reserva al módulo de facturación (SAP/John)
      description: Interoperabilidad. Contrato de datos **por confirmar** con John.
      parameters:
        - $ref: "#/components/parameters/ReservaId"
      responses:
        "202":
          description: Enviado a facturación (procesamiento asíncrono)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InteropFacturacion"
  /interop/facturacion/callback:
    post:
      tags: [Facturacion]
      summary: Callback de facturación (SAP/John) con el resultado
      description: Recibe orden de venta/comprobante y estado ocupado/no ocupado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InteropCallback"
      responses:
        "200":
          description: Procesado
  /empresas:
    get:
      tags: [Empresas]
      summary: Busca empresas (proxy hacia la fuente única / John / Niel)
      parameters:
        - name: q
          in: query
          description: Razón social o RUC
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Empresa"
  /empresas/listar:
    get:
      tags: [Empresas]
      summary: Bandeja paginada de empresas registradas por el backoffice
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
        - name: search
          in: query
          description: Razón social o RUC
          schema: { type: string }
        - name: estado
          in: query
          schema: { type: string, enum: [activa, inactiva] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, total, page, perPage, totalPages]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/EmpresaRegistrada"
                  total: { type: integer }
                  page: { type: integer }
                  perPage: { type: integer }
                  totalPages: { type: integer }
        "403":
          description: Sin permiso empresas:view
  /empresas/detalle:
    get:
      tags: [Empresas]
      summary: Detalle de una empresa registrada
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmpresaRegistrada"
        "404":
          $ref: "#/components/responses/NotFound"
  /empresas/crear:
    post:
      tags: [Empresas]
      summary: Alta individual de empresa (valida RUC, correos y duplicados)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmpresaRegistradaInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmpresaRegistrada"
        "400":
          description: Datos inválidos (RUC, razón social, correos o comprobante)
        "409":
          description: RUC ya registrado
  /empresas/actualizar:
    post:
      tags: [Empresas]
      summary: Edición parcial de una empresa (solo campos enviados)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/EmpresaRegistradaInput"
                - type: object
                  required: [id]
                  properties:
                    id: { type: string, format: uuid }
      responses:
        "200":
          description: OK
  /empresas/estado:
    post:
      tags: [Empresas]
      summary: Activa o desactiva una empresa (baja lógica)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, estado]
              properties:
                id: { type: string, format: uuid }
                estado: { type: string, enum: [activa, inactiva] }
      responses:
        "200":
          description: OK
  /empresas/carga-masiva/previsualizar:
    post:
      tags: [Empresas]
      summary: Valida un archivo Excel/CSV de empresas (validación previa por fila)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo: { type: string, format: binary }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrevisualizacionCargaEmpresas"
        "400":
          description: Formato/tamaño inválido o archivo sin filas
  /empresas/carga-masiva/importar:
    post:
      tags: [Empresas]
      summary: Importa las filas válidas de la carga masiva (omite las que tienen error)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filas]
              properties:
                filas:
                  type: array
                  items:
                    $ref: "#/components/schemas/FilaCargaEmpresa"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [creadas, omitidas]
                properties:
                  creadas: { type: integer }
                  omitidas: { type: integer }
  /empresas/crear-cuenta:
    post:
      tags: [Empresas]
      summary: Crea la cuenta del Portal del Cliente y envía las credenciales por correo
      description: |
        1 cuenta por empresa (creada explícitamente por el backoffice). Genera una
        contraseña temporal (cambio obligatorio en el primer ingreso), vincula el usuario
        a la empresa y envía el correo. La respuesta indica si el correo salió.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultadoCredencialesEmpresa"
        "400":
          description: La empresa no tiene correo de contacto/facturación
        "409":
          description: La empresa ya tiene cuenta o el correo ya está registrado
  /empresas/reenviar-credenciales:
    post:
      tags: [Empresas]
      summary: Regenera la contraseña temporal y reenvía las credenciales
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultadoCredencialesEmpresa"
        "404":
          $ref: "#/components/responses/NotFound"
  /auth/cambiar-password:
    post:
      tags: [Auth]
      summary: Cambia la contraseña temporal (primer ingreso) y reemite la sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passwordActual, passwordNueva]
              properties:
                passwordActual: { type: string }
                passwordNueva: { type: string, minLength: 8 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok, requiereValidarDatos]
                properties:
                  ok: { type: boolean }
                  requiereValidarDatos: { type: boolean, description: "La empresa aún debe validar sus datos" }
        "400":
          description: Contraseña actual incorrecta o nueva inválida
  /portal/empresa/mis-datos:
    get:
      tags: [Portal]
      summary: Datos de la empresa vinculada al usuario autenticado
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmpresaRegistrada"
        "404":
          $ref: "#/components/responses/NotFound"
  /portal/empresa/validar:
    post:
      tags: [Portal]
      summary: Valida/actualiza los datos contractuales de la empresa (primer ingreso)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmpresaRegistradaInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmpresaRegistrada"
  /auth/idioma:
    patch:
      tags: [Auth]
      summary: Guarda el idioma preferido del usuario (selector ES/EN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idioma]
              properties:
                idioma: { type: string, enum: [es, en] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [idioma]
                properties:
                  idioma: { type: string, enum: [es, en] }
        "400":
          description: Idioma no soportado
  /facturacion/adjuntar-comprobante:
    post:
      tags: [Facturacion]
      summary: Adjunta el comprobante fiscal (boleta/factura) de una cuota pagada y notifica al cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cuotaId, tipo, numero, url]
              properties:
                cuotaId: { type: string, format: uuid }
                tipo: { type: string, enum: [factura, boleta] }
                numero: { type: string, maxLength: 30 }
                url: { type: string, maxLength: 500, description: URL devuelta por /api/upload }
      responses:
        "200":
          description: OK
        "400":
          description: Datos invalidos
        "403":
          description: Sin permiso de facturacion
        "404":
          description: Cuota no encontrada
        "409":
          description: La cuota no esta pagada
  /pagos/solicitar-factura:
    post:
      tags: [Facturacion]
      summary: Registra la reserva en el IIMP y emite la factura/boleta de la 1ra cuota
      description: >
        Llama a `POST /stands/reserva` del IIMP (reserva stands + contrato + cuenta corriente +
        comprobante de la 1ra cuota) con la empresa del usuario. Guarda contrato y documento.
        No idempotente del lado del IIMP; si la solicitud ya tiene contrato registrado responde 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cuotaId]
              properties:
                cuotaId: { type: string, format: uuid }
      responses:
        "200":
          description: Reserva registrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  contrato: { type: string, description: Numero de contrato IIMP (10 digitos) }
                  cuentaCorriente: { type: integer, description: Numero de cuenta corriente en el IIMP }
                  documento:
                    type: object
                    nullable: true
                    description: Comprobante de la 1ra cuota; null si el IIMP no lo devolvio
                    properties:
                      tipoDocumento: { type: string, description: "01 Factura / 03 Boleta" }
                      serie: { type: string }
                      numero: { type: integer }
                      fechaEmision: { type: string, description: AAAA-MM-DD }
                      tipoCambio: { type: string }
                      igv: { type: string }
                      total: { type: string }
        "400":
          description: Validacion (empresa, RUC, direccion fiscal, evento, stands o cuotas)
        "403":
          description: Sin acceso a esta cuota
        "404":
          description: Cuota o solicitud no encontrada / evento inexistente en el IIMP
        "409":
          description: Reserva ya registrada o stands ya reservados en el IIMP
        "502":
          description: Error o sesion vencida del API del IIMP
  /sgc/detalle:
    get:
      tags: [SGC]
      summary: Detalle del expediente SGC de una solicitud (stepper + historial)
      parameters:
        - name: solicitudId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SgcExpedienteDetalle"
        "404":
          $ref: "#/components/responses/NotFound"
  /sgc/descarga:
    get:
      tags: [SGC]
      summary: Enlace de descarga (vida corta) del contrato firmado vigente
      parameters:
        - name: solicitudId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SgcUrlDescarga"
        "404":
          $ref: "#/components/responses/NotFound"
  /sgc/sincronizar:
    post:
      tags: [SGC]
      summary: Reconciliación — refresca el estado de los expedientes creados
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [sincronizados]
                properties:
                  sincronizados: { type: integer }
  /sgc/subsanar:
    post:
      tags: [SGC]
      summary: Empuja una versión corregida del contrato (subsanación)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [solicitudId, documentId, url]
              properties:
                solicitudId: { type: string, format: uuid }
                documentId: { type: string }
                url: { type: string }
                title: { type: string }
      responses:
        "200":
          description: OK
  /sgc/subsanacion-motivo:
    post:
      tags: [SGC]
      summary: Declara la casuística de subsanación (el admin elige el flujo de corrección)
      description: |
        Cuando el SGC devuelve (observed) o rechaza (rejected) el trámite, el administrador
        declara qué corregir. El `modo` define el flujo del cliente:
        - `nuevo_contrato`: el admin subirá una versión corregida; el cliente **espera**
          (no puede firmar el contrato observado) hasta que el contrato nuevo esté adjunto.
        - `mismo_contrato`: el cliente vuelve a firmar el contrato vigente de inmediato.
        Sin `modo` (null) el cliente puede firmar (comportamiento legacy).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [solicitudId]
              properties:
                solicitudId: { type: string, format: uuid }
                motivo: { type: string, maxLength: 500, nullable: true }
                modo:
                  type: string
                  nullable: true
                  enum: [nuevo_contrato, mismo_contrato]
      responses:
        "200":
          description: OK
        "404":
          $ref: "#/components/responses/NotFound"
  /sgc/reenviar:
    post:
      tags: [SGC]
      summary: Reenvía al SGC con el contrato firmado del cliente (reabre la ronda)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [solicitudId]
              properties:
                solicitudId: { type: string, format: uuid }
      responses:
        "200":
          description: OK
        "400":
          description: Falta el contrato firmado del cliente
        "404":
          $ref: "#/components/responses/NotFound"
  /integracion/sgc/webhook:
    post:
      tags: [SGC]
      summary: Receptor de webhooks del SGC (firma HMAC-SHA256)
      security: []
      parameters:
        - name: x-sgc-signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SgcWebhookPayload"
      responses:
        "200":
          description: Recibido
        "401":
          description: Firma inválida
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    EventoId:
      name: eventoId
      in: path
      required: true
      schema:
        type: string
    ReservaId:
      name: reservaId
      in: path
      required: true
      schema:
        type: string
  responses:
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ValidationError:
      description: Error de validación (Zod)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    Vertical:
      type: string
      enum: [proexplo, wmc, gess, perumin]
    EstadoStand:
      type: string
      enum: [disponible, en_evaluacion, reservado]
    EstadoReserva:
      type: string
      enum:
        [
          borrador,
          registrada,
          en_aprobacion,
          aprobada,
          enviada_facturacion,
          facturada,
          rechazada,
          cancelada,
        ]
    TipoComprobante:
      type: string
      enum: [factura, boleta]
    EventoPadre:
      type: object
      required: [id, codigo, vertical, nombre]
      properties:
        id: { type: string }
        codigo: { type: string, example: WMC }
        vertical: { $ref: "#/components/schemas/Vertical" }
        nombre: { type: string }
    Evento:
      type: object
      required: [id, eventoPadreId, tipoEvento, codigoEvento, estado]
      properties:
        id: { type: string }
        eventoPadreId: { type: string }
        tipoEvento: { type: integer, example: 14 }
        codigoEvento: { type: integer, example: 1 }
        planoRef: { type: string }
        anio: { type: string, example: "2026" }
        estado:
          type: string
          enum: [draft, active, closed, cancelled]
    TipoStand:
      type: object
      required: [id, nombre, montoBase]
      properties:
        id: { type: string }
        nombre: { type: string, example: preferencial }
        medidas: { type: string, example: "3x3" }
        montoBase: { type: number, example: 12000 }
        moneda: { type: string, example: USD }
        contratoUrl: { type: string }
    PlanoStand:
      type: object
      required: [standId, numero, x, y, estado]
      properties:
        standId: { type: string }
        numero: { type: string, example: "01" }
        tipoStand: { type: string, example: isla }
        monto: { type: number, example: 12000 }
        tipoCamara: { type: string }
        numeroCamara: { type: string }
        x: { type: number }
        y: { type: number }
        estado: { $ref: "#/components/schemas/EstadoStand" }
        empresa: { type: string, description: "Visible solo si está reservado" }
    Cuota:
      type: object
      required: [numero, porcentaje]
      properties:
        numero: { type: integer, example: 1 }
        porcentaje: { type: number, example: 40 }
        monto: { type: number }
        fechaPago: { type: string, format: date }
    DatosFacturacion:
      type: object
      required: [tipoComprobante]
      properties:
        tipoComprobante: { $ref: "#/components/schemas/TipoComprobante" }
        razonSocial: { type: string }
        ruc: { type: string }
        nombre: { type: string }
        numeroDocumento: { type: string }
        direccion: { type: string }
        correo: { type: string, format: email }
    ReservaCreate:
      type: object
      required: [eventoId, standIds, empresaRef, facturacion]
      properties:
        eventoId: { type: string }
        standIds:
          type: array
          minItems: 1
          items: { type: string }
        empresaRef: { type: string, description: "Id externo de empresa (John/Niel)" }
        facturacion: { $ref: "#/components/schemas/DatosFacturacion" }
        cuotas:
          type: array
          items: { $ref: "#/components/schemas/Cuota" }
    Aprobacion:
      type: object
      properties:
        area:
          type: string
          enum: [legal, logistica, eventos]
        estado:
          type: string
          enum: [pendiente, aprobado, rechazado]
        responsable: { type: string }
        comentario: { type: string }
        fecha: { type: string, format: date-time }
    AprobacionInput:
      type: object
      required: [area, estado]
      properties:
        area:
          type: string
          enum: [legal, logistica, eventos]
        estado:
          type: string
          enum: [aprobado, rechazado]
        comentario: { type: string }
    Reserva:
      type: object
      required: [id, eventoId, estado]
      properties:
        id: { type: string }
        eventoId: { type: string }
        empresaRef: { type: string }
        standIds:
          type: array
          items: { type: string }
        facturacion: { $ref: "#/components/schemas/DatosFacturacion" }
        cuotas:
          type: array
          items: { $ref: "#/components/schemas/Cuota" }
        aprobaciones:
          type: array
          items: { $ref: "#/components/schemas/Aprobacion" }
        estado: { $ref: "#/components/schemas/EstadoReserva" }
        creadoEn: { type: string, format: date-time }
    InteropFacturacion:
      type: object
      properties:
        reservaId: { type: string }
        estado:
          type: string
          enum: [enviado, confirmado, error]
        ordenVenta: { type: string }
        comprobante: { type: string }
    InteropCallback:
      type: object
      required: [reservaId, estado]
      properties:
        reservaId: { type: string }
        estado:
          type: string
          enum: [confirmado, error]
        ordenVenta: { type: string }
        comprobante: { type: string }
        standsOcupados:
          type: array
          items: { type: string }
    Empresa:
      type: object
      properties:
        id: { type: string }
        razonSocial: { type: string }
        ruc: { type: string }
        origen:
          type: string
          enum: [john, niel, local]
    EmpresaRegistradaInput:
      type: object
      required: [ruc, razonSocial]
      properties:
        ruc: { type: string, minLength: 11, maxLength: 11 }
        razonSocial: { type: string, maxLength: 200 }
        nombreComercial: { type: string, nullable: true, maxLength: 200 }
        direccionFiscal: { type: string, nullable: true, maxLength: 250 }
        telefono: { type: string, nullable: true, maxLength: 30 }
        emailContacto: { type: string, nullable: true, format: email }
        emailFacturacion: { type: string, nullable: true, format: email }
        representanteLegalNombre: { type: string, nullable: true, maxLength: 200 }
        representanteLegalDni: { type: string, nullable: true, maxLength: 15 }
        tipoComprobante: { type: string, enum: [factura, boleta], default: factura }
        sitioWeb: { type: string, nullable: true, maxLength: 200 }
    EmpresaRegistrada:
      allOf:
        - $ref: "#/components/schemas/EmpresaRegistradaInput"
        - type: object
          properties:
            id: { type: string, format: uuid }
            estado: { type: string, enum: [activa, inactiva] }
            cuentaCreada: { type: boolean }
            primerAccesoCompletado: { type: boolean }
            datosValidadosEn: { type: string, format: date-time, nullable: true }
            creadoPor: { type: string, nullable: true }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    FilaCargaEmpresa:
      type: object
      required: [numero]
      properties:
        numero: { type: integer, description: "Fila del archivo (1 = encabezado)" }
        ruc: { type: string }
        razonSocial: { type: string }
        nombreComercial: { type: string }
        direccionFiscal: { type: string }
        telefono: { type: string }
        emailContacto: { type: string }
        emailFacturacion: { type: string }
        representanteLegalNombre: { type: string }
        representanteLegalDni: { type: string }
        tipoComprobante: { type: string }
        sitioWeb: { type: string }
    PrevisualizacionCargaEmpresas:
      type: object
      required: [filas, resumen]
      properties:
        filas:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/FilaCargaEmpresa"
              - type: object
                required: [estado, mensajes]
                properties:
                  estado: { type: string, enum: [lista, advertencia, error] }
                  mensajes: { type: array, items: { type: string } }
        resumen:
          type: object
          required: [listas, advertencias, errores]
          properties:
            listas: { type: integer }
            advertencias: { type: integer }
            errores: { type: integer }
    ResultadoCredencialesEmpresa:
      type: object
      required: [email, emailEnviado]
      properties:
        email: { type: string, format: email, description: "Usuario de la cuenta del Portal" }
        emailEnviado: { type: boolean, description: "True si el correo con las credenciales salió" }
    ApiError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string }
        detalles:
          type: array
          items: { type: string }
    GessStand:
      type: object
      required: [id, eventoId, standApiId, standCode]
      properties:
        id: { type: string }
        eventoId: { type: string }
        standApiId: { type: string, description: "UID del stand en el API externo" }
        standCode: { type: string, description: "Código visible (01, 02, ...)" }
        tipoStand: { type: string, nullable: true, example: "PREFERENCIAL" }
        medidas: { type: string, nullable: true, example: "3000.00 US$" }
        estado: { type: string, nullable: true, example: "Reservado" }
        empresa: { type: string, nullable: true, example: "CETEMIN" }
        pabellon: { type: string, nullable: true }
        ubicacion: { type: string, nullable: true }
        bloqueId: { type: string, nullable: true, description: "ID del bloque 3D vinculado" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    GessSyncResult:
      type: object
      required: [creados, actualizados, total]
      properties:
        creados: { type: integer }
        actualizados: { type: integer }
        total: { type: integer }
    SgcCompletedBy:
      type: object
      properties:
        actorName: { type: string }
        areaName: { type: string }
        completedAt: { type: string, format: date-time }
        constancy: { type: string, enum: [acknowledgement, visa, normal-signature, stamp] }
    SgcStep:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        kind: { type: string }
        position: { type: integer }
        status: { type: string, enum: [completed, current, pending] }
        areaId: { type: string, nullable: true }
        completedBy:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/SgcCompletedBy"
    SgcHistoryItem:
      type: object
      properties:
        id: { type: string }
        source: { type: string }
        title: { type: string }
        detail: { type: string }
        actorName: { type: string }
        occurredAt: { type: string, format: date-time }
    SgcDocumentoResumen:
      type: object
      properties:
        documentId: { type: string }
        category: { type: string, enum: [contract, annex] }
        title: { type: string }
        currentVersionId: { type: string, nullable: true }
    SgcExpedienteDetalle:
      type: object
      properties:
        contractId: { type: string }
        code: { type: string }
        name: { type: string }
        stage: { type: string, enum: [drafting, internal-review, approval, validity, closed] }
        lifecycleStatus: { type: string, nullable: true, enum: [active, finalized, observed, rejected] }
        areaName: { type: string, nullable: true }
        contractTypeName: { type: string, nullable: true }
        counterpartyName: { type: string, nullable: true }
        counterpartyEmail: { type: string, nullable: true }
        counterpartyTaxIdentifier: { type: string, nullable: true }
        currency: { type: string, nullable: true }
        totalMinorUnits: { type: integer, nullable: true }
        startDate: { type: string, nullable: true }
        endDate: { type: string, nullable: true }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        documents:
          type: array
          items: { $ref: "#/components/schemas/SgcDocumentoResumen" }
        steps:
          type: array
          items: { $ref: "#/components/schemas/SgcStep" }
        history:
          type: array
          items: { $ref: "#/components/schemas/SgcHistoryItem" }
    SgcUrlDescarga:
      type: object
      required: [url, expiresInSeconds]
      properties:
        url: { type: string }
        expiresInSeconds: { type: integer }
    SgcWebhookPayload:
      type: object
      required: [apiVersion, eventId, eventType, createdAt, resource, data]
      properties:
        apiVersion: { type: string }
        eventId: { type: string }
        eventType:
          type: string
          enum: [workflow.started, workflow.advanced, workflow.returned, workflow.approved, workflow.rejected, contract.closed]
        createdAt: { type: string, format: date-time }
        resource:
          type: object
          properties:
            id: { type: string }
            type: { type: string }
            code: { type: string, nullable: true }
        data: { type: object, additionalProperties: true }
