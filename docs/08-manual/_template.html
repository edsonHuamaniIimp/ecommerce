<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Manual del Exhibidor — Portal de Reserva de Stands IIMP</title>
<style>
  @page { margin: 2.2cm 2cm; }
  body { font-family: Calibri, "Segoe UI", Arial, sans-serif; font-size: 11pt; line-height: 1.5; color: #1f2937; }
  h1 { font-size: 22pt; color: #0f2d52; border-bottom: 3px solid #c9a227; padding-bottom: 6px; page-break-before: always; }
  h1:first-of-type { page-break-before: avoid; }
  h2 { font-size: 15pt; color: #0f2d52; margin-top: 18pt; }
  h3 { font-size: 12.5pt; color: #1e3a5f; margin-top: 14pt; }
  table { border-collapse: collapse; width: 100%; margin: 10pt 0; }
  th, td { border: 1px solid #cbd5e1; padding: 5pt 7pt; text-align: left; font-size: 10pt; vertical-align: top; }
  th { background: #0f2d52; color: #fff; }
  img { max-width: 100%; border: 1px solid #cbd5e1; border-radius: 4px; margin: 6pt 0; page-break-inside: avoid; }
  blockquote { border-left: 4px solid #c9a227; background: #f8fafc; margin: 10pt 0; padding: 6pt 12pt; color: #334155; }
  code { background: #f1f5f9; padding: 1pt 3pt; border-radius: 3px; font-family: Consolas, monospace; font-size: 10pt; }
  em { color: #475569; display: block; font-size: 9.5pt; margin-top: -2pt; }
  ol, ul { margin: 6pt 0; }
  li { margin: 2pt 0; }
  pre { background: #f1f5f9; padding: 8pt; border-radius: 4px; }
</style>
</head>
<body>
{{BODY}}
</body>
</html>
