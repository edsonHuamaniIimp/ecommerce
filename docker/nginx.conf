server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/contratosstands.sistemasiimp.org.pe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/contratosstands.sistemasiimp.org.pe/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /app/public;
    client_max_body_size 50M;

    # ─── Health check (sin auth) ─────────────────────────────────────────
    location = /health {
        access_log off;
        return 200 "OK";
    }

    # ─── Uploads (archivos subidos por usuarios) ─────────────────────────
    location /uploads/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ─── Next.js static assets (long-term cache) ─────────────────────────
    location /_next/static {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        alias /app/.next/static;
    }

    # ─── Favicon y robots ────────────────────────────────────────────────
    location = /favicon.ico {
        expires 1w;
        access_log off;
    }

    # ─── Next.js App ─────────────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # ─── Deny hidden files ───────────────────────────────────────────────
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
