services:
  postgres:
    image: postgres:16-alpine
    container_name: ctrst-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ctrst
      POSTGRES_PASSWORD: ctrst_dev
      POSTGRES_DB: contratos_stands
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
