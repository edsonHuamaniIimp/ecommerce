services:
  postgres:
    image: postgres:16-alpine
    container_name: ctrst-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ctrst
      POSTGRES_PASSWORD: ctrst_dev
      POSTGRES_DB: contratos_stands
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ctrst-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ctrst"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  ctrst-net:
    driver: bridge

volumes:
  pgdata:
